// WhatsApp's wa.me click-to-chat links can only pre-fill TEXT — there is no URL scheme that also
// attaches a photo, so a captured photo can't be auto-sent with the message. This helper gets as
// close as the browser allows: on phones that support the native Web Share API with files (most
// modern Android/iOS browsers), it opens the share sheet with the photo AND the ticket text
// together so the person can tap WhatsApp and send both in one go. Where that's not supported, it
// falls back to downloading the photo so it can be attached manually inside WhatsApp.
async function shareOrDownloadPhoto(dataUrl, filename, text){
  try{
    const res = await fetch(dataUrl);
    const blob = await res.blob();
    const file = new File([blob], filename, {type: blob.type || 'image/jpeg'});
    if(navigator.canShare && navigator.canShare({files:[file]})){
      await navigator.share({files:[file], text});
      return 'shared';
    }
  }catch(err){ /* fall through to download */ }
  try{
    const a = document.createElement('a');
    a.href = dataUrl; a.download = filename;
    document.body.appendChild(a); a.click(); a.remove();
    return 'downloaded';
  }catch(err){ return 'failed'; }
}

// A brand-new garment line always starts fully blank — color, defects, and treatment are chosen
// per garment and must NEVER carry over from the line before it. Every place that adds a new line
// ("+ Add another garment", the very first line on a fresh ticket) builds its item from this one
// function so that rule can't drift out of sync between them. (Duplicating a line on purpose —
// the "⧉ Duplicate last garment" shortcut — is the deliberate exception: that one is meant to copy.)
function blankDraftItem(){
  return {garmentId:'', qty:1, category:'', grade:'', treatmentId:'', manualTreatmentPrice:undefined, packing:DB.packingTypes[0], color:'', defects:''};
}
function garmentsInCategory(category){
  if(!category) return [];
  if(category==='Uncategorized') return sortByName(DB.garments.filter(g=>!g.category));
  return sortByName(DB.garments.filter(g=>g.category===category));

// ---- Smart / fast New Order helpers ----
// Ranks booking items by how often they've actually been booked across every order, so the busiest
// items surface as one-tap "Quick add" chips instead of staff hunting through category → description
// every single time. Falls back to filling remaining slots alphabetically when history is thin.
function topFrequentGarments(limit, category){
  limit = limit || 8;
  const counts = {};
  (state.orders||[]).forEach(o=>(o.items||[]).forEach(i=>{ if(i.name) counts[i.name] = (counts[i.name]||0) + 1; }));
  const pool = category ? DB.garments.filter(g=>(g.category||'')===category) : DB.garments;
  const ranked = Object.keys(counts).sort((a,b)=>counts[b]-counts[a]);
  const result = [];
  ranked.forEach(name=>{
    const g = pool.find(g=>g.name===name);
    if(g && !result.some(r=>r.id===g.id)) result.push(g);
  });
  if(result.length<limit){
    sortByName(pool).forEach(g=>{ if(result.length<limit && !result.some(r=>r.id===g.id)) result.push(g); });
  }
  return result.slice(0, limit);
}
const QUICK_ADD_PAGE_SIZE = 10;
// The Quick add bar shows the 10 most-booked items first — the ones staff need most often — with a
// "More ›" button to reveal the next 10, and, once past the first page, a reversible "‹ Back" button
// to return to the previous 10. quickAddPage tracks which page is showing. Once a Category has been
// picked on any garment row, the bar narrows to just that category (state.quickAddCategory) — so after
// choosing "Mens" the chips shown are Mens items only, instead of a mixed bag across every category.
function renderQuickAddBar(){
  const cat = state.quickAddCategory;
  const pool = cat ? DB.garments.filter(g=>(g.category||'')===cat) : DB.garments;
  if(pool.length===0){
    if(!cat) return '';
    // A category filter with nothing in it — show just enough to get back to "All categories".
    return `<div class="quick-add-bar" id="quick-add-bar">
      <span class="quick-add-label">⚡ Quick add — ${esc(cat)}</span>
      <div class="chip-row" id="quick-add-chips" style="margin:0; flex:1; align-items:center;">
        <span class="note" style="margin:0;">No items in ${esc(cat)} yet.</span>
        <button type="button" class="chip-btn quick-add-nav" id="quick-add-clear-category">✕ All categories</button>
      </div>
    </div>`;
  }
  const ranked = topFrequentGarments(Math.min(pool.length, QUICK_ADD_PAGE_SIZE*4), cat);
  if(ranked.length===0) return '';
  const maxPage = Math.max(0, Math.ceil(ranked.length/QUICK_ADD_PAGE_SIZE)-1);
  if(quickAddPage>maxPage) quickAddPage = maxPage;
  const start = quickAddPage*QUICK_ADD_PAGE_SIZE;
  const pageItems = ranked.slice(start, start+QUICK_ADD_PAGE_SIZE);
  const hasBack = quickAddPage>0;
  const hasMore = start+QUICK_ADD_PAGE_SIZE < ranked.length;
  return `<div class="quick-add-bar" id="quick-add-bar">
    <span class="quick-add-label">⚡ Quick add${cat?` — ${esc(cat)}`:''}</span>
    <div class="chip-row" id="quick-add-chips" style="margin:0; flex:1; align-items:center;">
      ${pageItems.map((g,i)=>`<button type="button" class="chip-btn quick-add-chip" data-garment="${g.id}" style="--qi:${i%5};">+ ${esc(g.name)}</button>`).join('')}
      ${hasBack?`<button type="button" class="chip-btn quick-add-nav" id="quick-add-back">‹ Back</button>`:''}
      ${hasMore?`<button type="button" class="chip-btn quick-add-nav" id="quick-add-more">More ›</button>`:''}
      ${cat?`<button type="button" class="chip-btn quick-add-nav" id="quick-add-clear-category" title="Show items from every category again">✕ All categories</button>`:''}
    </div>
  </div>`;
}
function bindQuickAddBar(shopId){
  if(!document.getElementById('quick-add-bar')) return;

  }

  }

// One tap: fills a fully-formed draft line (category, default grade, sensible qty for the item's
// pricing mode) straight from a Quick add chip. If the only line on the ticket is still blank, it's
// replaced rather than leaving an empty row above the new one.
function quickAddGarment(shopId, garmentId){
  const g = DB.garments.find(g=>g.id===garmentId);
  if(!g) return;
  const mode = garmentPricingMode(garmentId);
  const item = Object.assign(blankDraftItem(), {garmentId:g.id, category:g.category||'Uncategorized', grade:(DB.itemGrades||[])[0]||''});
  if(mode==='area'){ item.length=undefined; item.width=undefined; item.qty=0; item.pieces=1; }
  else if(mode==='panel'){ item.qty=1; item.pieces=1; }
  else { item.qty=1; item.pieces=undefined; }
  if(draftItems.length===1 && !draftItems[0].garmentId) draftItems[0] = item;
  else draftItems.push(item);
  renderItemsWrap(shopId); updateTicketPreview(shopId);
  showToast(`Added ${g.name} — set qty/treatment, or add another.`);
}
// Fast repeat entry: clones the last garment line that has an item picked (color/defects carried
// over, photo left behind) so multiples of the same garment take one tap instead of a full re-pick.
function duplicateLastGarment(shopId){
  const last = draftItems.slice().reverse().find(i=>i.garmentId);
  if(!last){ showToast('Add a garment first, then duplicate it.'); return; }
  const copy = Object.assign({}, last);
  delete copy.photoDataUrl; delete copy.photoAt;
  draftItems.push(copy);
  renderItemsWrap(shopId); updateTicketPreview(shopId);
  showToast('Duplicated last garment — adjust and continue.');
}

function renderItemsWrap(shopId){
  // Rebuilding the row list can change its total height (a price note appearing/disappearing, etc.),
  // which shifts everything below it — capture and restore the page's scroll position around the
  // swap so that doesn't read as the page suddenly jumping while someone is mid-entry.
  const scrollY = window.scrollY;
  document.getElementById('items-wrap').innerHTML = draftItems.map((it,i)=>itemRowHtml(shopId,it,i)).join('');
  window.scrollTo(window.scrollX, scrollY);
  document.querySelectorAll('.remove-item').forEach((btn)=>{
    btn.onclick=()=>{ const idx=parseInt(btn.closest('[data-item-idx]').dataset.itemIdx); draftItems.splice(idx,1); renderItemsWrap(shopId); updateTicketPreview(shopId); };
  });
  document.querySelectorAll('.it-photo-btn').forEach(btn=>{
    btn.onclick = ()=>{
      const idx = btn.dataset.photoIdx;
      const input = document.querySelector(`.it-photo-input[data-photo-idx="${idx}"]`);
      if(input) input.click();
    };
  });
  document.querySelectorAll('.it-photo-input').forEach(input=>{
    input.onchange = async(e)=>{
      const idx = parseInt(input.dataset.photoIdx);
      const file = e.target.files[0];
      if(!file) return;
      try{
        const dataUrl = await compressImageFile(file);
        if(draftItems[idx]){
          draftItems[idx].photoDataUrl = dataUrl;
          draftItems[idx].photoAt = new Date().toISOString();
        }
        renderItemsWrap(shopId); updateTicketPreview(shopId);
        showToast('Item photo saved.');
      }catch(err){ showToast('⚠ Could not process that photo — try again.'); }
    };
  });
  bindItemInputs(shopId);
}
// ---- Keyboard flow helpers for the New Drop-off item rows ----
// After a field is selected/matched (dropdown click, exact text typed, or Enter pressed), these move
// focus straight to the next field in that garment row automatically — so staff can keep both hands
// on the keyboard/scanner and never have to reach for the mouse or hunt for the next box. Fields that
// aren't required are simply skipped over, same as a normal Tab would do, since we just walk the row's
// actual focusable elements in the order they're drawn.
function focusNextInRow(shopId, idx, currentSelector){
  const row = document.querySelector(`#items-wrap [data-item-idx="${idx}"]`);
  if(!row){ advanceToNextRowOrEnd(idx); return; }
  const focusables = Array.from(row.querySelectorAll('input, select, textarea, button')).filter(el=>!el.disabled && el.offsetParent!==null);
  const curEl = row.querySelector(currentSelector);
  const at = curEl ? focusables.indexOf(curEl) : -1;
  if(at>=0 && at+1<focusables.length){
    const next = focusables[at+1];
    // preventScroll: without it, the browser auto-scrolls the newly focused field into view — and
    // since the row's height just changed (a price note appearing/disappearing above it), that scroll
    // lands somewhere unexpected and reads as the whole page suddenly jumping. The field is already
    // on-screen right after a row rebuild, so there's nothing to scroll to reach it.
    next.focus({preventScroll:true});
    if(next.tagName==='INPUT'){ try{ next.select(); }catch(e){} }
    return;
  }
  advanceToNextRowOrEnd(idx);
}
function advanceToNextRowOrEnd(idx){
  const nextRow = document.querySelector(`#items-wrap [data-item-idx="${idx+1}"]`);
  if(nextRow){
    const firstField = nextRow.querySelector('.it-category-search');
    if(firstField){ firstField.focus({preventScroll:true}); return; }
  }
  const addBtn = document.getElementById('add-item');
  if(addBtn) addBtn.focus({preventScroll:true});
}
function bindItemInputs(shopId){
  document.querySelectorAll('#items-wrap [data-item-idx]').forEach(row=>{
    const idx = parseInt(row.dataset.itemIdx);
    const commitCategory = (typed)=>{
      const match = categorySearchChoices().find(c=>c.toLowerCase()===typed.toLowerCase());
      if(match===undefined || match===null) return false;
      let selected = false;
      if(typed===''){ draftItems[idx].category = ''; }
      else if(match){
        draftItems[idx].category = match;
        // if the currently chosen item description doesn't belong to the new category, clear it
        const inScope = garmentsInCategory(match).some(g=>g.id===draftItems[idx].garmentId);
        if(!inScope) draftItems[idx].garmentId = '';
        selected = true;
        // Narrow the Quick add bar to this category too, so its chips match what's about to be
        // picked here instead of a mixed bag across every category.
        if(state.quickAddCategory !== match){ state.quickAddCategory = match; quickAddPage = 0; refreshQuickAddBar(shopId); }
      } else {
        return false;
      }
      renderItemsWrap(shopId);
      updateTicketPreview(shopId);
      return selected;
    };
    row.querySelector('.it-category-search').oninput = e=>{
      // Auto-advance the moment a valid category is matched, so staff don't have to reach for Tab —
      // saves time and matches how the rest of the ticket is meant to move field-to-field.
      if(commitCategory(e.target.value.trim())) focusNextInRow(shopId, idx, '.it-category-search');
    };
    row.querySelector('.it-category-search').onkeydown = e=>{
      if(e.key!=='Enter') return;
      e.preventDefault(); // never let Enter submit the ticket early — it just confirms/advances here
      if(commitCategory(e.target.value.trim())) focusNextInRow(shopId, idx, '.it-category-search');
    };
    row.querySelectorAll('.it-category-chip').forEach(chip=>{
      chip.onclick = ()=>{ if(commitCategory(chip.dataset.category)) focusNextInRow(shopId, idx, '.it-category-search'); };
    });
    const commitGrade = (typed)=>{
      if(typed===''){ draftItems[idx].grade = ''; renderItemsWrap(shopId); updateTicketPreview(shopId); return false; }
      const match = sortAlphaStrings(DB.itemGrades).map(o=>o.v).find(g=>g.toLowerCase()===typed.toLowerCase());
      if(!match) return false;
      draftItems[idx].grade = match;
      renderItemsWrap(shopId); // refresh so treatment prices reflect the new grade
      updateTicketPreview(shopId);
      popupPriceForItem(draftItems[idx]);
      return true;
    };
    row.querySelector('.it-grade-search').oninput = e=>{
      if(commitGrade(e.target.value.trim())) focusNextInRow(shopId, idx, '.it-grade-search');
    };
    row.querySelector('.it-grade-search').onkeydown = e=>{
      if(e.key!=='Enter') return;
      e.preventDefault();
      if(commitGrade(e.target.value.trim())) focusNextInRow(shopId, idx, '.it-grade-search');
    };
    row.querySelectorAll('.it-grade-chip').forEach(chip=>{
      chip.onclick = ()=>{ if(commitGrade(chip.dataset.grade)) focusNextInRow(shopId, idx, '.it-grade-search'); };
    });
    // Selecting an item description — shared by clicking a suggestion AND by typing/pasting an exact
    // name and tabbing away, so the price line always appears the moment a valid item is chosen,
    // consistent with how Category/Grade/Treatment behave (whose exact-typed-text always matches too).
    const selectDescriptionMatch = (match)=>{
      if(!match) return;
      const prevMode = garmentPricingMode(draftItems[idx].garmentId);
      draftItems[idx].garmentId = match.id;
      draftItems[idx].unitType = undefined; // a new item description means a new default — clear any NO/PAIR override from the previous item
      const newMode = garmentPricingMode(draftItems[idx].garmentId);
      if(newMode!==prevMode){
        // qty means something different in each mode (pieces vs sq.ft vs panels) — reset to a sensible default when switching
        if(newMode==='area'){ draftItems[idx].length=undefined; draftItems[idx].width=undefined; draftItems[idx].qty=0; draftItems[idx].pieces=1; }
        else if(newMode==='panel'){ draftItems[idx].qty=1; draftItems[idx].pieces=1; }
        else { draftItems[idx].qty=1; draftItems[idx].pieces=undefined; }
      }
      renderItemsWrap(shopId); // refresh so treatment prices — and the price line — reflect the new garment
      updateTicketPreview(shopId);
      popupPriceForItem(draftItems[idx]);
      // The row rebuild above replaces this field's DOM node, which silently drops keyboard focus —
      // that's what made Tab/Enter appear to "stop working" here specifically. Re-focus explicitly onto
      // the next field in the (now-updated) row so the keyboard flow continues without a break.
      focusNextInRow(shopId, idx, '.it-description-search');
    };
    // Builds/replaces the item-description suggestion dropdown. Used both while typing (filtered
    // matches) and the moment the field is focused with nothing typed yet — showing the whole
    // category's items right away, instead of making staff type before anything appears.
    const renderDescOptions = (list)=>{
      const resultsEl = row.querySelector('.it-desc-results');
      if(!resultsEl) return;
      if(list.length===0){ resultsEl.style.display='none'; resultsEl.innerHTML=''; return; }
      resultsEl.innerHTML = list.map(g=>`<div class="it-desc-option" data-id="${esc(g.id)}" style="padding:9px 12px; cursor:pointer; font-size:13px; border-bottom:1px solid var(--line);">${esc(g.name)}</div>`).join('');
      resultsEl.style.display='block';
      resultsEl.querySelectorAll('.it-desc-option').forEach(opt=>{
        opt.onmousedown = (ev)=>{ // mousedown fires before the input's blur, so the click registers
          ev.preventDefault();
          const match = list.find(g=>g.id===opt.dataset.id);
          selectDescriptionMatch(match);
        };
      });
    };
    row.querySelector('.it-description-search').onkeydown = e=>{
      if(e.key!=='Enter') return;
      e.preventDefault(); // stop Enter from submitting the ticket early
      if(draftItems[idx].garmentId){ focusNextInRow(shopId, idx, '.it-description-search'); return; }
      const typed = e.target.value.trim();
      const category = draftItems[idx].category;
      if(typed.length>=2 && category){
        const exact = garmentsInCategory(category).find(g=>g.name.toLowerCase()===typed.toLowerCase());
        if(exact) selectDescriptionMatch(exact); // selectDescriptionMatch re-focuses the next field itself
      }
    };
    row.querySelector('.it-description-search').onfocus = e=>{
      // Landing in an empty description field with a category already chosen — show every item in
      // that category right away rather than waiting for the first couple of letters to be typed.
      const category = draftItems[idx].category;
      if(!category || draftItems[idx].garmentId) return;
      if(e.target.value.trim()==='') renderDescOptions(garmentsInCategory(category));
    };
    row.querySelector('.it-description-search').oninput = e=>{
      const typed = e.target.value.trim();
      const category = draftItems[idx].category;
      const options = garmentsInCategory(category);
      if(draftItems[idx].garmentId){ draftItems[idx].garmentId=''; updateTicketPreview(shopId); } // typing again means the previous selection no longer applies
      if(!category){ renderDescOptions([]); return; }
      if(typed.length===0){ renderDescOptions(options); return; } // back to empty — show the whole category again, in Price List order
      // Exact match (case-insensitive) selects immediately — covers typing/autofill/paste of the full
      // name, not just clicking a suggestion, so the price line isn't left blank waiting for a click.
      const exact = options.find(g=>g.name.toLowerCase()===typed.toLowerCase());
      if(exact){ renderDescOptions([]); selectDescriptionMatch(exact); return; }
      const matches = options.filter(g=>g.name.toLowerCase().includes(typed.toLowerCase()));
      renderDescOptions(matches);
    };
    row.querySelector('.it-description-search').onblur = ()=>{
      const resultsEl = row.querySelector('.it-desc-results');
      if(resultsEl) resultsEl.style.display='none';
      // Fallback: if the field was blurred (tabbed away, virtual keyboard "Done", etc.) without a
      // dropdown click registering, but the typed text is an exact match, select it anyway so the
      // price still shows — this is what most often looked like "price line missing" on mobile.
      const input = row.querySelector('.it-description-search');
      if(!draftItems[idx].garmentId && input){
        const typed = input.value.trim();
        const category = draftItems[idx].category;
        if(typed.length>=2 && category){
          const exact = garmentsInCategory(category).find(g=>g.name.toLowerCase()===typed.toLowerCase());
          if(exact) selectDescriptionMatch(exact);
        }
      }
    };
    const qtyInput = row.querySelector('.it-qty');
    if(qtyInput){
      const mode = garmentPricingMode(draftItems[idx].garmentId);
      qtyInput.oninput = e=>{ draftItems[idx].qty = parseFloat(e.target.value)||(mode==='panel'?0.5:1); updateItemLineTotal(shopId, idx); updateTicketPreview(shopId); };
    }
    const piecesInput = row.querySelector('.it-pieces');
    if(piecesInput){
      piecesInput.oninput = e=>{ draftItems[idx].pieces = parseInt(e.target.value)||1; updateItemLineTotal(shopId, idx); updateTicketPreview(shopId); };
    }
    const lengthInput = row.querySelector('.it-length');
    const widthInput = row.querySelector('.it-width');
    if(lengthInput && widthInput){
      const recalcArea = ()=>{
        const len = parseFloat(lengthInput.value)||0;
        const wid = parseFloat(widthInput.value)||0;
        draftItems[idx].length = len; draftItems[idx].width = wid;
        draftItems[idx].qty = Math.round(len*wid*100)/100;
        const areaEl = row.querySelector('.it-area-value');
        if(areaEl) areaEl.textContent = draftItems[idx].qty;
        updateItemLineTotal(shopId, idx);
        updateTicketPreview(shopId);
      };
      lengthInput.oninput = recalcArea;
      widthInput.oninput = recalcArea;
    }
    row.querySelector('.it-color').oninput = e=>{
      draftItems[idx].color = e.target.value;
      row.querySelectorAll('.it-color-chip').forEach(chip=>paintColorChip(chip, csvIncludes(e.target.value, chip.dataset.color)));
    };
    row.querySelectorAll('.it-color-chip').forEach(chip=>{
      paintColorChip(chip, chip.classList.contains('on')); // initial paint, so the actual color shows the moment the row appears
      chip.onclick = ()=>{
        const field = row.querySelector('.it-color');
        field.value = csvToggle(field.value, chip.dataset.color);
        draftItems[idx].color = field.value;
        row.querySelectorAll('.it-color-chip').forEach(c=>paintColorChip(c, csvIncludes(field.value, c.dataset.color)));
      };
    });
    const manualPriceInput = row.querySelector('.it-manual-treatment-price');
    if(manualPriceInput){
      manualPriceInput.oninput = e=>{
        draftItems[idx].manualTreatmentPrice = parseFloat(e.target.value)||0;
        updateItemLineTotal(shopId, idx);
        updateTicketPreview(shopId);
      };
    }
    const commitTreatment = (typed)=>{
      if(typed===''){ draftItems[idx].treatmentId=''; draftItems[idx].manualTreatmentPrice=undefined; renderItemsWrap(shopId); updateTicketPreview(shopId); return false; }
      const treatmentOptions = sortByName(DB.treatments.filter(t=>!t.deletedAt));
      const match = treatmentOptions.find(t=>t.name.toLowerCase()===typed.toLowerCase());
      if(!match) return false;
      draftItems[idx].treatmentId = match.id;
      if(!match.manualPrice) draftItems[idx].manualTreatmentPrice = undefined;
      renderItemsWrap(shopId); // refresh so the manual price field shows/hides correctly
      updateTicketPreview(shopId);
      popupPriceForItem(draftItems[idx]);
      return true;
    };
    row.querySelector('.it-treatment-search').oninput = e=>{
      if(commitTreatment(e.target.value.trim())) focusNextInRow(shopId, idx, '.it-treatment-search');
    };
    row.querySelector('.it-treatment-search').onkeydown = e=>{
      if(e.key!=='Enter') return;
      e.preventDefault();
      if(commitTreatment(e.target.value.trim())) focusNextInRow(shopId, idx, '.it-treatment-search');
    };
    row.querySelectorAll('.it-treatment-chip').forEach(chip=>{
      chip.onclick = ()=>{ if(commitTreatment(chip.dataset.treatment)) focusNextInRow(shopId, idx, '.it-treatment-search'); };
    });
    row.querySelectorAll('.it-unittype-chip').forEach(chip=>{
      chip.onclick = ()=>{
        draftItems[idx].unitType = chip.dataset.unittype;
        renderItemsWrap(shopId); // refresh so the chip states and the pair note reflect the override
        updateTicketPreview(shopId);
        popupPriceForItem(draftItems[idx]);
      };
    });
    row.querySelector('.it-packing').onchange = e=>{ draftItems[idx].packing = e.target.value; };
    row.querySelector('.it-defects').oninput = e=>{
      draftItems[idx].defects = e.target.value;
      row.querySelectorAll('.it-defect-chip').forEach(chip=>chip.classList.toggle('on', csvIncludes(e.target.value, chip.dataset.defect)));
    };
    row.querySelectorAll('.it-defect-chip').forEach(chip=>{
      chip.onclick = ()=>{
        const field = row.querySelector('.it-defects');
        field.value = csvToggle(field.value, chip.dataset.defect);
        draftItems[idx].defects = field.value;
        row.querySelectorAll('.it-defect-chip').forEach(c=>c.classList.toggle('on', csvIncludes(field.value, c.dataset.defect)));
      };
    });
  });
}
function popupPriceForItem(item){
  if(!item || !item.garmentId) return;
  const priceInfo = draftItemPricing(item);
  const name = garmentName(item.garmentId);
  const tName = treatmentName(item.treatmentId);
  const label = tName ? `${name} + ${tName}` : name;
  const unitBit = priceInfo.mode!=='piece' ? ` (${money(priceInfo.unitPrice)}${pricingModeUnitSuffix(priceInfo.mode)})` : '';
  const pairBit = effectiveUnitType(item)==='pair' ? ` — ${priceInfo.total} pcs` : '';
  showItemPricePopup(`${label}${unitBit} — ${money(priceInfo.lineTotal)}${pairBit}`);
}
function updateItemLineTotal(shopId, idx){
  const row = document.querySelector(`#items-wrap [data-item-idx="${idx}"]`);
  if(!row) return;
  const item = draftItems[idx];
  if(!item || !item.garmentId) return;
  const priceInfo = draftItemPricing(item);
  const unitEl = row.querySelector('.it-unit-price');
  const totalEl = row.querySelector('.it-line-total');
  const totalPiecesEl = row.querySelector('.it-total-pieces');
  if(unitEl) unitEl.textContent = money(priceInfo.unitPrice);
  if(totalEl) totalEl.textContent = money(priceInfo.lineTotal);
  if(totalPiecesEl) totalPiecesEl.textContent = priceInfo.total;
  popupPriceForItem(item);
}
function updateTicketPreview(shopId){
  const form = document.getElementById('order-form');
  if(!form) return;
  const service = DB.services.find(s=>s.id===form.serviceId.value) || DB.services[0];
  const dueDateVal = form.dueDate.value || addDays(todayISO(), service?service.days:0);
  const dueDateDisplay = document.getElementById('due-date-display');
  if(dueDateDisplay) dueDateDisplay.textContent = 'Delivery: ' + fmtDueDate(dueDateVal);

  // Item counts, highlighted — Gross (booking units, e.g. 2 pairs) and Total (physical pieces, e.g. 4)
  // are shown together the moment a pair-counted item is added, so nobody has to count rows to know
  // how many items it really is.
  const counts = draftItemCounts();
  const badge = document.getElementById('total-items-badge');
  if(badge) badge.innerHTML = itemCountBadgeContent(counts);

  // "Items booked so far" — a running checklist so staff (and the customer, if they ask) can see
  // exactly what's been added to this ticket, with its price, before the ticket is saved.
  const previewEl = document.getElementById('items-booked-preview');
  if(!previewEl) return;
  const bookedItems = draftItems.filter(i=>i.garmentId);
  if(bookedItems.length===0){
    previewEl.innerHTML = `<div class="note" style="margin:0;">No garments added yet. As you add each garment above it will be checked off here with its price.</div>`;
    return;
  }
  let runningTotal = 0;
  const rows = bookedItems.map(i=>{
    const priceInfo = draftItemPricing(i);
    runningTotal += priceInfo.lineTotal;
    const mode = priceInfo.mode;
    let qtyBit;
    if(mode==='area') qtyBit = `${i.length||0}×${i.width||0} ft${(i.pieces||1)>1?` × ${i.pieces} items`:''}`;
    else if(mode==='panel') qtyBit = `${i.qty||0} panel${i.qty===1?'':'s'}${(i.pieces||1)>1?` × ${i.pieces} items`:''}`;
    else qtyBit = `× ${i.qty||0}`;
    if(effectiveUnitType(i)==='pair') qtyBit += ` (pair/set = ${priceInfo.total} pcs)`;
    const name = garmentName(i.garmentId);
    const tName = treatmentName(i.treatmentId);
    return `<div class="t-row" style="align-items:flex-start;">
      <span>✓ ${esc(name)}${i.color?` ${csvList(i.color).map(c=>`<span class="color-swatch-dot color-swatch-dot-sm" style="background:${colorChipVisual(c).dot};" title="${esc(c)}"></span>`).join('')}(${esc(i.color)})`:''}${tName?' + '+esc(tName):''} <span style="color:var(--slate);">${esc(qtyBit)}</span></span>
      <span style="white-space:nowrap; margin-left:8px;">${money(priceInfo.lineTotal)}</span>
    </div>`;
  }).join('');
  const surcharge = service ? (service.surcharge||0) : 0;
  const subtotal = runningTotal + surcharge;
  // Live discount, mirroring orderDiscountAmount() — membership % (if the checkbox is ticked) plus any
  // manual percent/flat discount entered on the form — so "Total" reflects what the customer will actually pay.
  const memChk = document.getElementById('apply-membership-discount');
  const membershipPercent = (memChk && memChk.checked) ? parseFloat(memChk.dataset.percent)||0 : 0;
  const statusChk = document.getElementById('apply-status-discount');
  const statusPercent = (statusChk && statusChk.checked) ? parseFloat(statusChk.dataset.percent)||0 : 0;
  let discount = subtotal * ((membershipPercent+statusPercent)/100);
  const discType = form.manualDiscountType ? form.manualDiscountType.value : 'none';
  const discVal = form.manualDiscountValue ? (parseFloat(form.manualDiscountValue.value)||0) : 0;
  if(discType==='percent') discount += subtotal * (discVal/100);
  else if(discType==='amount') discount += discVal;
  discount = Math.min(discount, subtotal);
  const grandTotal = subtotal - discount;
  previewEl.innerHTML = `<div style="font-weight:600; margin-bottom:8px; display:flex; align-items:center; justify-content:space-between; gap:10px;">
      <span>Items booked so far — check against the garments in hand</span>
      <span class="total-items-badge" style="flex-shrink:0;">${itemCountBadgeContent(counts)}</span>
    </div>
    ${rows}
    ${surcharge?`<div class="t-row" style="color:var(--slate);"><span>Service surcharge (${esc(service.name)})</span><span>${money(surcharge)}</span></div>`:''}
    <div class="t-row" style="border-top:1px solid var(--line); margin-top:6px; padding-top:6px; font-weight:600;"><span>Sub Total</span><span>${money(subtotal)}</span></div>
    ${discount>0?`<div class="t-row" style="color:var(--slate);"><span>Discount</span><span>-${money(discount)}</span></div>`:''}
    <div class="t-total"><span>Total</span><span>${money(grandTotal)}</span></div>`;
}

// ---------------- Orders / Billing / Reports (shop) ----------------
function orderSubtotal(o){
  const itemsTotal = o.items.reduce((s,i)=>s+orderItemLineTotal(i),0);
  const service = DB.services.find(sv=>sv.id===o.serviceId);
  return itemsTotal + (service?service.surcharge:0);
}
function orderDiscountAmount(o){
  const subtotal = orderSubtotal(o);
  let discount = 0;
  if(o.membershipDiscountPercent) discount += subtotal * (o.membershipDiscountPercent/100);
  if(o.statusDiscountPercent) discount += subtotal * (o.statusDiscountPercent/100);
  if(o.manualDiscountType==='percent') discount += subtotal * ((o.manualDiscountValue||0)/100);
  else if(o.manualDiscountType==='amount') discount += (o.manualDiscountValue||0);
  return Math.min(discount, subtotal);
}
function orderTotal(o){
  return orderSubtotal(o) - orderDiscountAmount(o);
}
function receiptItemCountHtml(o){
  const counts = orderItemCounts(o);
  if(counts.gross===counts.total) return `<div class="r-highlight"><span>TOTAL ITEMS</span><span>${counts.total}</span></div>`;
  return `<div class="r-highlight"><span>GROSS ITEMS</span><span>${counts.gross}</span></div><div class="r-highlight"><span>TOTAL ITEMS (incl. pairs)</span><span>${counts.total}</span></div>`;
}
function itemLabel(i){
  let s = esc(i.name);
  if(i.color) s += ` (${esc(i.color)})`;
  if(i.treatmentName) s += ' + '+esc(i.treatmentName);
  if(i.grade && DB.itemGrades[0] && i.grade!==DB.itemGrades[0]) s += ' — '+esc(i.grade);
  s += ' '+esc(itemQtyLabel(i));
  return s;
}
// Gross vs Total item counts for a saved order.
// Gross = booking units as entered (qty for piece-priced garments, or the "number of items" field for
// area/panel-priced garments like carpets/curtains — qty there is the billable sq.ft/panel measure, not a count).
// Total = actual physical pieces — gross doubled for any garment set up in Masters as "No. of Pair"
// (shoes, gloves, socks, etc., where one booking unit = 2 physical pieces).
function orderItemCounts(o){
  return (o.items||[]).reduce((acc,i)=>{
    acc.gross += orderItemGrossUnits(i);
    acc.total += orderItemTotalPieces(i);
    return acc;
  }, {gross:0, total:0});
}
// Backwards-compatible shortcut — physical piece total (what most receipts/tags should show).
function orderTotalItemCount(o){ return orderItemCounts(o).total; }
function orderGrossItemCount(o){ return orderItemCounts(o).gross; }
// "Item No" line used on the WhatsApp booking/delivery ticket messages — numbers each item as it
// appears on the printed ticket so the message matches what's on the paper/label.
function orderItemNoText(o){
  const items = o.items||[];
  if(!items.length) return '—';
  return items.map((it,idx)=>`${idx+1}) ${it.name}${it.color?' ('+it.color+')':''}`).join(', ');
}
// "PAID IN CASH / UPI / MEMBERSHIP / NOT PAID" line for the delivery-ticket WhatsApp message.
function paymentStatusText(o){
  if(!o.paid) return 'Not Paid';
  if(o.membershipDiscountPercent) return 'Membership';
  return o.paymentMode || 'Paid';
}
// Builds the highlighted item-count badge. Shows a single "Total items" figure when every item is
// counted 1-for-1 (the common case), or both "Gross" (booking units, e.g. 2 pairs) and "Total"
// (physical pieces, e.g. 4) the moment any pair-counted item is in the order — that's the whole point
// of tracking pairs separately, so staff/customers see both numbers when they matter.
function itemCountBadgeContent(counts){
  if(counts.gross === counts.total) return `Total items: ${counts.total}`;
  return `Gross: ${counts.gross} &nbsp;·&nbsp; Total items: ${counts.total}`;
}
function itemCountBadgeHtml(counts, extraStyle){
  const style = extraStyle ? ` style="${extraStyle}"` : '';
  return `<span class="total-items-badge"${style}>${itemCountBadgeContent(counts)}</span>`;
}
// Same idea, but for the in-progress draft while a booking is being created.
function draftItemCounts(){
  return draftItems.filter(i=>i.garmentId).reduce((acc,i)=>{
    const priceInfo = draftItemPricing(i);

function ensureReportDefaults(){

    return inRange && inScope;

function reportItemStatus(scopeShopId){
  if(!state.itemStatusFilterStage) state.itemStatusFilterStage = 'all';
  if(!state.itemStatusFilterDefect) state.itemStatusFilterDefect = 'all';
  const stageFilter = state.itemStatusFilterStage;
  const defectFilter = state.itemStatusFilterDefect;
  const orders = rangeOrders(scopeShopId).sort((a,b)=>b.createdAt.localeCompare(a.createdAt));
  const stageChips = ['all', ...STATUS].map(s=>{
    const label = s==='all' ? 'All Stages' : STATUS_LABEL[s];
    const count = s==='all' ? orders.reduce((n,o)=>n+o.items.length,0) : orders.reduce((n,o)=>n+o.items.filter(i=>(o.status==='delivered'?'delivered':itemStage(i))===s).length,0);
    return `<button type="button" class="chip-btn ${stageFilter===s?'on':''}" data-itemstatus-stage="${s}">${esc(label)}${count>0?` (${count})`:''}</button>`;
  }).join('');
  const defectChips = ['all', ...sortAlphaStrings(DB.defectTypes).map(x=>x.v)].map(d=>{
    const label = d==='all' ? 'All / No filter' : d;
    let count = 0;
    if(d!=='all'){ orders.forEach(o=>o.items.forEach(i=>{ if(csvIncludes(i.defects,d)) count++; })); }
    return `<button type="button" class="chip-btn ${defectFilter===d?'on':''}" data-itemstatus-defect="${esc(d)}">${esc(label)}${count>0?` (${count})`:''}</button>`;
  }).join('');
  const rows = [];
  orders.forEach(o=>{
    o.items.forEach(i=>{
      // Each item tracks its own place in the pipeline now — once the order itself is delivered
      // to the customer, every item is naturally "Delivered" too, regardless of its last stage.
      const curStage = o.status==='delivered' ? 'delivered' : itemStage(i);
      if(stageFilter!=='all' && curStage!==stageFilter) return;

    });
  });
  const downloadBtn = `<button type="button" class="btn small" id="itemstatus-download-btn" data-scope="${scopeShopId||''}" style="margin-top:10px;">⬇ Download this Item Status report</button>`;
  const filterBar = `<div class="card">

    <div class="note" style="margin:14px 0 6px 0;">Filter by defect / issue</div>
    <div class="chip-row">${defectChips}</div>
    ${downloadBtn}
  </div>`;
  if(rows.length===0) return filterBar + '<div class="card"><div class="empty">No items match this filter in the selected date range.</div></div>';
  return filterBar + `<div class="card" style="padding:0;"><div style="padding:16px 20px 0 20px;"><h3>Item status, order-wise</h3></div>
    <div style="padding:0 20px 16px 20px; overflow-x:auto;"><table><thead><tr><th>Ticket</th>${scopeShopId?'':'<th>Shop</th>'}<th>Customer</th><th>Item</th><th>Color</th><th>Grade</th><th>Treatment</th><th>Defects</th><th>Current status</th></tr></thead>
    <tbody>${rows.join('')}</tbody></table></div></div>`;
}
// Standalone CSV export for the Item Status report — respects whatever stage/defect filter and
// date range is currently active, so "day by day" just means picking the From/To dates first.
function downloadItemStatusCSV(scopeShopId){
  ensureReportDefaults();
  const stageFilter = state.itemStatusFilterStage || 'all';
  const defectFilter = state.itemStatusFilterDefect || 'all';
  const orders = rangeOrders(scopeShopId).sort((a,b)=>b.createdAt.localeCompare(a.createdAt));
  const lines = [];
  lines.push('Item Status Report');
  lines.push(`Range,${state.reportFrom} to ${state.reportTo}`);
  lines.push(`Stage filter,${stageFilter==='all'?'All Stages':STATUS_LABEL[stageFilter]}`);
  lines.push(`Defect filter,${defectFilter==='all'?'All / No filter':defectFilter}`);
  lines.push('');
  lines.push(['Ticket','Shop','Customer','Phone','Item','Qty','Color','Grade','Treatment','Defects','Current Status','Order Created'].join(','));
  let count = 0;
  orders.forEach(o=>{
    o.items.forEach(i=>{
      const curStage = o.status==='delivered' ? 'delivered' : itemStage(i);
      if(stageFilter!=='all' && curStage!==stageFilter) return;
      if(defectFilter!=='all' && !csvIncludes(i.defects, defectFilter)) return;
      lines.push([o.id, shopName(o.shopId), o.customer, o.phone, i.name, i.qty, i.color||'', i.grade||'', i.treatmentName||'', i.defects||'', STATUS_LABEL[curStage], o.createdAt.slice(0,10)].map(csvEscape).join(','));
      count++;
    });
  });
  if(count===0){ showToast('No items match this filter in the selected date range.'); return; }
  const csvContent = lines.join('\n');
  const blob = new Blob([csvContent], {type:'text/csv;charset=utf-8;'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = `item-status_${state.reportFrom}_to_${state.reportTo}.csv`;
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  URL.revokeObjectURL(url);
}
function reportTransfers(scopeShopId){
  const orders = state.orders.filter(o=>!scopeShopId || o.shopId===scopeShopId);
  const entries = [];
  orders.forEach(o=>{
    (o.transferLog||[]).forEach(t=>{
      const d = t.at.slice(0,10);
      if(d>=state.reportFrom && d<=state.reportTo) entries.push({ order:o, from:t.from, to:t.to, method:t.method, by:t.by, at:t.at });
    });
  });
  entries.sort((a,b)=>b.at.localeCompare(a.at));
  const byStaff = {};
  entries.forEach(e=>{

    byStaff[e.by].total++;

// Every individual PIECE's own move history — "Staff Transfers" above only logs when an order's
// overall (slowest-item) status changes, so a piece that moves stages while the rest of its order
// hasn't caught up leaves no trace there. Every move here (kanban, RFID scan, bulk move) already
// carries who did it and when in item.stageLog / item.rfidLog — this report is just the missing
// place that surfaces it, at full per-item granularity, so nothing moves without a name and a time
// attached to it in a report.
function reportItemMoves(scopeShopId){
  const orders = state.orders.filter(o=>!scopeShopId || o.shopId===scopeShopId);
  const entries = [];
  orders.forEach(o=>{
    (o.items||[]).forEach(item=>{
      (item.stageLog||[]).forEach(l=>{
        const d = (l.at||'').slice(0,10);
        if(d>=state.reportFrom && d<=state.reportTo) entries.push({order:o, item, kind:'Stage move', from:l.from, to:l.to, method:l.method, by:l.by, at:l.at});
      });
      (item.rfidLog||[]).forEach(l=>{
        const d = (l.at||'').slice(0,10);
        if(d>=state.reportFrom && d<=state.reportTo) entries.push({order:o, item, kind:l.action, from:'', to:l.detail||'', method:'RFID/Barcode station', by:l.by, at:l.at});
      });
    });
  });
  entries.sort((a,b)=>b.at.localeCompare(a.at));
  const byStaff = {};
  entries.forEach(e=>{ byStaff[e.by] = (byStaff[e.by]||0) + 1; });
  const staffRows = Object.entries(byStaff).sort((a,b)=>b[1]-a[1]);
  return `<div class="stat-row"><div class="stat"><div class="num serif">${entries.length}</div><div class="label">Item movements in range</div></div></div>
  <div class="card"><h3>By staff member</h3>
    ${staffRows.length===0?'<div class="empty">No movements in this range.</div>':
    `<table><thead><tr><th>Staff</th><th>Movements</th></tr></thead><tbody>
    ${staffRows.map(([name,n])=>`<tr><td>${esc(name)}</td><td><strong>${n}</strong></td></tr>`).join('')}
    </tbody></table>`}
  </div>
  <div class="card"><h3>Every item movement</h3>
    ${entries.length===0?'<div class="empty">No movements logged in this range.</div>':
    `<table><thead><tr><th>Date/Time</th><th>Ticket</th>${scopeShopId?'':'<th>Shop</th>'}<th>Item</th><th>Staff</th><th>Action</th><th>Method</th></tr></thead><tbody>
    ${entries.map(e=>`<tr><td>${new Date(e.at).toLocaleString()}</td><td>${esc(e.order.id)}</td>${scopeShopId?'':'<td>'+esc(shopName(e.order.shopId))+'</td>'}<td>${esc(e.item.name||'')}${e.item.tagId?' <span style="color:var(--slate); font-size:10.5px;">('+esc(e.item.tagId)+')</span>':''}</td><td>${esc(e.by)}</td><td>${e.from?esc(e.from)+' → '+esc(e.to):esc(e.kind)+(e.to?': '+esc(e.to):'')}</td><td>${esc(e.method)}</td></tr>`).join('')}
    </tbody></table>`}
  </div>`;
}

function csvEscape(v){
  if(v===null||v===undefined) return '';
  const s = String(v);
  if(/[",\n]/.test(s)) return '"' + s.replace(/"/g,'""') + '"';
  return s;
}
function downloadMasterReportCSV(){
  ensureReportDefaults();
  const lines = [];
  lines.push('Master Report');
  lines.push(`Range,${state.reportFrom} to ${state.reportTo}`);
  lines.push('');

  const orders = rangeOrders(null).sort((a,b)=>b.createdAt.localeCompare(a.createdAt));
  lines.push('ORDERS');
  lines.push(['Ticket','Shop','Customer','Phone','Pieces','Created','Ready By','Status','Total'].join(','));
  orders.forEach(o=>{
    lines.push([o.id, shopName(o.shopId), o.customer, o.phone, o.items.reduce((s,i)=>s+i.qty,0), o.createdAt.slice(0,10), o.dueDate, STATUS_LABEL[o.status], orderTotal(o).toFixed(2)].map(csvEscape).join(','));
  });
  lines.push('');

  const byPhone = {};
  orders.forEach(o=>{
    if(!byPhone[o.phone]) byPhone[o.phone] = {phone:o.phone, name:o.customer, orders:0, spend:0};
    byPhone[o.phone].orders++; byPhone[o.phone].spend += orderTotal(o);
  });
  lines.push('CUSTOMERS');
  lines.push(['Customer','Phone','Orders in range','Spend in range','Current Due Balance'].join(','));
  Object.values(byPhone).sort((a,b)=>b.spend-a.spend).forEach(r=>{
    lines.push([r.name, r.phone, r.orders, r.spend.toFixed(2), customerDueBalance(r.phone).toFixed(2)].map(csvEscape).join(','));
  });
  lines.push('');

  lines.push('ITEM STATUS');
  lines.push(['Ticket','Shop','Customer','Item','Qty','Color','Grade','Treatment','Status'].join(','));
  orders.forEach(o=>{
    o.items.forEach(i=>{
      const curStage = o.status==='delivered' ? 'delivered' : itemStage(i);
      lines.push([o.id, shopName(o.shopId), o.customer, i.name, i.qty, i.color||'', i.grade||'', i.treatmentName||'', STATUS_LABEL[curStage]].map(csvEscape).join(','));
    });
  });
  lines.push('');

  const delivered = state.orders.filter(o=>{
    if(!o.deliveredAt) return false;
    const d = o.deliveredAt.slice(0,10);
    return d>=state.reportFrom && d<=state.reportTo;
  }).sort((a,b)=>b.deliveredAt.localeCompare(a.deliveredAt));
  lines.push('DELIVERY');
  lines.push(['Ticket','Shop','Customer','Delivered','Total'].join(','));
  delivered.forEach(o=>{
    lines.push([o.id, shopName(o.shopId), o.customer, o.deliveredAt.slice(0,10), orderTotal(o).toFixed(2)].map(csvEscape).join(','));
  });
  lines.push('');

  const paidOrders = orders.filter(o=>o.paid);
  const unpaidOrders = orders.filter(o=>!o.paid);
  const byMode = {};
  paidOrders.forEach(o=>{ const m=o.paymentMode||'Unspecified'; byMode[m]=(byMode[m]||0)+orderTotal(o); });
  lines.push('PAYMENTS');
  lines.push(['Payment Mode','Amount Collected'].join(','));
  Object.entries(byMode).forEach(([m,v])=>{ lines.push([m, v.toFixed(2)].map(csvEscape).join(',')); });
  lines.push(['Total Collected', paidOrders.reduce((s,o)=>s+orderTotal(o),0).toFixed(2)].join(','));
  lines.push(['Total Due (orders in range)', unpaidOrders.reduce((s,o)=>s+orderTotal(o),0).toFixed(2)].join(','));
  lines.push('');

  const undelivered = orders.filter(o=>o.status!=='delivered').sort((a,b)=>a.dueDate.localeCompare(b.dueDate));
  lines.push('UNDELIVERED ORDERS');
  lines.push(['Ticket','Shop','Customer','Phone','Ready By','Status','Total'].join(','));
  undelivered.forEach(o=>{
    lines.push([o.id, shopName(o.shopId), o.customer, o.phone, o.dueDate, STATUS_LABEL[o.status], orderTotal(o).toFixed(2)].map(csvEscape).join(','));
  });
  lines.push('');

  lines.push('OUTSTANDING PAYMENTS');
  lines.push(['Ticket','Shop','Customer','Phone','Status','Amount Due'].join(','));
  unpaidOrders.slice().sort((a,b)=>b.createdAt.localeCompare(a.createdAt)).forEach(o=>{
    lines.push([o.id, shopName(o.shopId), o.customer, o.phone, STATUS_LABEL[o.status], orderTotal(o).toFixed(2)].map(csvEscape).join(','));
  });

  const csvContent = lines.join('\n');
  const blob = new Blob([csvContent], {type:'text/csv;charset=utf-8;'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = `master-report_${state.reportFrom}_to_${state.reportTo}.csv`;
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  URL.revokeObjectURL(url);
}

function nextStage(s){ const i=ACTIVE_STAGES.indexOf(s); return i>=0 && i<ACTIVE_STAGES.length-1 ? ACTIVE_STAGES[i+1] : 'delivered'; }
// Compact horizontal stepper — booking → pre-processing → processing → pre-finishing → packing → in
// store — used on the customer profile so staff can see exactly where each pending ticket sits at a
// glance, without opening the workshop queue.
function orderStageStepperHtml(o){
  if(o.status==='cancelled') return `<span class="pill cancelled">Cancelled</span>`;
  const stages = ACTIVE_STAGES;
  const curIdx = o.status==='delivered' ? stages.length : stages.indexOf(o.status);
  const steps = stages.map((s,i)=>{
    const done = curIdx>=0 && i<curIdx;
    const current = i===curIdx;
    const bg = current ? 'var(--teal)' : done ? 'var(--ok-bg)' : '#EEF1F0';
    const textColor = current ? '#fff' : done ? 'var(--ok)' : 'var(--slate)';
    return `<span style="display:inline-flex; align-items:center;">
      <span style="font-size:10px; font-weight:700; padding:3px 8px; border-radius:10px; background:${bg}; color:${textColor}; white-space:nowrap;">${done?'✓ ':''}${STATUS_LABEL[s]}</span>
      ${i<stages.length-1?`<span style="width:12px; height:2px; background:${i<curIdx?'var(--teal)':'var(--line)'}; margin:0 2px;"></span>`:''}
    </span>`;
  }).join('');
  const deliveredTag = o.status==='delivered' ? ` <span class="pill delivered" style="margin-left:6px;">Delivered to Customer</span>` : '';
  return `<div style="display:flex; align-items:center; flex-wrap:wrap; gap:2px; margin-top:6px;">${steps}${deliveredTag}</div>`;
}
function kanbanCardActions(o, item, stage){
  const isAdmin = hasFullAccess(state.currentStaff.role);
  const transferSelect = `<select class="transfer-method-select" data-order="${o.id}" data-item="${item.id}" style="flex:1; padding:5px 6px; font-size:12px;">${DB.transferMethods.map(m=>`<option>${esc(m)}</option>`).join('')}</select>`;
  // Every item movement must be authorized by scanning its barcode/RFID tag first — for Store
  // Supervisor and Counter Staff. Admin and Super Admin are never locked out at any stage; they
  // can move any item straight away, no scan required.
  // A successful scan is remembered here (state.workshopCardUnlocked, keyed by order+item+stage)
  // rather than only flipped live in the DOM — the toast that confirms a scan worked calls
  // render(), which rebuilds this card fresh from scratch, and a DOM-only unlock would get wiped
  // out by that very same render before Move could ever be clicked. Including the stage in the key
  // means the unlock naturally stops applying once the item actually moves on.
  const cardKey = `${o.id}::${item.id}::${stage}`;
  const isCardUnlocked = isAdmin || (state.workshopCardUnlocked||[]).includes(cardKey);
  const scanGate = isCardUnlocked ? '' : `<input class="stage-scan-input" data-key="${esc(cardKey)}" data-order="${o.id}" data-tag="${esc(item.tagId||'')}" placeholder="🔒 Scan ${item.tagId?'this tag or ticket '+esc(o.id):'ticket '+esc(o.id)} to unlock" autocomplete="off" style="margin-bottom:6px;">`;
  const lockedAttr = isCardUnlocked ? '' : 'disabled';
  let extra = '';
  if(stage==='preprocess'){
    extra = `<label style="font-size:11px; margin:6px 0 2px 0;">Processing method</label>
      <select class="processing-method-select" data-order="${o.id}" data-item="${item.id}" style="width:100%; padding:5px 6px; font-size:12px; margin-bottom:6px;">
        ${sortAlphaStrings(DB.processingMethods).map(({v:m})=>`<option ${item.processingMethod===m?'selected':''}>${esc(m)}</option>`).join('')}
      </select>`;
  } else if(stage==='prefinish'){
    extra = `<label style="font-size:11px; margin:6px 0 2px 0;">Presser's name (if steam pressing)</label>
      <select class="pressed-by-input" data-order="${o.id}" data-item="${item.id}" style="width:100%; margin-bottom:6px;">
        <option value="">— Select presser —</option>
        ${sortAlphaStrings(DB.pressingStaff).map(({v:p})=>`<option ${item.pressedBy===p?'selected':''}>${esc(p)}</option>`).join('')}
      </select>`;
  } else if(stage==='packing' && DB.shops.length>1){
    extra = `<label style="font-size:11px; margin:6px 0 2px 0;">Store (which shop this batch goes to)</label>
      <select class="store-select" data-order="${o.id}" data-item="${item.id}" style="width:100%; padding:5px 6px; font-size:12px; margin-bottom:6px;">
        ${DB.shops.map(s=>`<option value="${s.id}" ${(item.storeId||o.shopId)===s.id?'selected':''}>${esc(s.name)}</option>`).join('')}
      </select>`;
  } else if(stage==='storedelivery'){
    // This item itself is done — but the whole ORDER only moves to Delivered once every item in it
    // has reached this stage, so gate the final action on the order's own (slowest-item) status.
    if(o.status==='storedelivery'){
      if(item.storeStatus!=='received'){
        // Sent here by Packing (possibly via a driver) but nobody at the store counter has
        // confirmed it physically arrived yet — offer that confirmation instead of delivery.
        return `${scanGate}<div style="display:flex; gap:6px;">
          <button class="btn small ghost store-receive-btn" data-order="${o.id}" data-item="${item.id}" ${lockedAttr}>Mark Received at Store</button>
        </div>`;
      }
      if(!orderReceivedAtStore(o)){
        return `<div class="note" style="margin:6px 0 0 0; font-size:11px; padding:6px 8px;">This piece is in — waiting on the rest of ${esc(o.id)} to arrive at the store.</div>`;
      }
      return `${scanGate}<div style="display:flex; gap:6px;">${isAdmin?transferSelect:''}
        <button class="btn small advance-btn" data-order="${o.id}" data-item="${item.id}" data-next="delivered" ${lockedAttr}>Move to Delivered</button>
      </div>`;
    }
    return `<div class="note" style="margin:6px 0 0 0; font-size:11px; padding:6px 8px;">Waiting on the rest of ${esc(o.id)} to finish.</div>`;
  }
  const targetOptions = ACTIVE_STAGES.filter(s=>s!==stage);
  const defaultNext = nextStage(stage);
  const stageSelect = `<select class="target-stage-select" data-order="${o.id}" data-item="${item.id}" style="width:100%; padding:5px 6px; font-size:12px; margin-bottom:6px;">
    ${targetOptions.map(s=>`<option value="${s}" ${s===defaultNext?'selected':''}>${STATUS_LABEL[s]}</option>`).join('')}
  </select>`;
  return `${extra}<label style="font-size:11px; margin:6px 0 2px 0;">Move to stage</label>${stageSelect}
    ${scanGate}
    <div style="display:flex; gap:6px;">${isAdmin?transferSelect:''}
      <button class="btn small advance-btn" data-order="${o.id}" data-item="${item.id}" data-next="__select__" ${lockedAttr}>Move</button>
    </div>`;
}
// Every item currently sitting in a given active stage, across every non-cancelled/non-delivered
// order — the single source of truth shared by the kanban board, its pending counts, and its
// per-stage CSV download, so all three always agree.
function workshopStageItems(stage){
  const cards = [];
  state.orders.forEach(o=>{
    if(o.status==='cancelled' || o.status==='delivered') return;
    o.items.forEach(item=>{ if(itemStage(item)===stage) cards.push({order:o, item}); });
  });
  return cards.sort((a,b)=>a.order.createdAt.localeCompare(b.order.createdAt));
}
// The date an item last entered a given stage, read back from its own move history — falls back
// to the order's booking date for an item still sitting at Received with no moves logged yet.
function itemEnteredStageAt(order, item, stage){
  const label = STATUS_LABEL[stage];
  const log = (item.stageLog||[]).slice().reverse().find(l=>l.to===label);
  if(log) return log.at;
  return stage==='received' ? order.createdAt : null;
}
function downloadWorkshopStageCSV(stage){
  const cards = workshopStageItems(stage);
  if(cards.length===0){ showToast(`No pending items in ${STATUS_LABEL[stage]} right now.`); return; }
  const lines = [];
  lines.push(`Workshop — ${STATUS_LABEL[stage]} — pending items`);
  lines.push(`Downloaded,${new Date().toISOString().slice(0,10)}`);
  lines.push('');
  lines.push(['Ticket','Shop','Customer','Priority','Phone','Item','Qty','Colour','Grade','Treatment','Defects at intake','Packing','Processing Method','Pressed By','Entered stage on','Date of delivery'].join(','));
  cards.forEach(({order:o, item})=>{
    const enteredAt = itemEnteredStageAt(o, item, stage);
    const pr = customerPriority(o.phone);
    lines.push([o.id, shopName(o.shopId), o.customer, pr?CUSTOMER_PRIORITY_META[pr].label:'', o.phone, item.name, item.qty, item.color||'', item.grade||'', item.treatmentName||'', item.defects||'', item.packing||'', item.processingMethod||'', item.pressedBy||'', enteredAt?enteredAt.slice(0,10):'', o.dueDate].map(csvEscape).join(','));
  });
  const csvContent = lines.join('\n');
  const blob = new Blob([csvContent], {type:'text/csv;charset=utf-8;'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = `workshop-${stage}_${todayISO()}.csv`;
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  URL.revokeObjectURL(url);
}

          ${o.notes?`<div style="font-size:12px; color:var(--slate); margin:4px 0 4px 0;">Note: ${esc(o.notes)}</div>`:''}
          <div style="font-size:11.5px; color:var(--slate); margin:4px 0 8px 0;"><strong style="color:var(--ink,#1E2A28);">Date of delivery:</strong> ${fmtDueDate(o.dueDate)}</div>
          ${kanbanCardActions(o, item, c.stage)}
        </div>`;}).join('')}
    </div>`).join('')}</div>`;
}
// A dedicated single-stage page (opened from "Open ›" on the kanban, or by clicking a pending
// count) — shows ONLY that stage's pending items, and lets staff build up a batch by scanning
// tickets one after another (individually, or several for a bulk move), while Admin/Super Admin
// can just tick checkboxes — then one "Move" sends the whole batch to the chosen next stage.
// Pre-Processing gets an extra grouping level: items land there sorted by TREATMENT first (Dry
// Clean, Wash, Steam Iron, etc. — whatever the customer ordered), so staff open one treatment group
// at a time rather than hunting through every pending item at once.
function renderPreprocessTreatmentGroups(){
  const cards = workshopStageItems('preprocess');
  const header = `<div style="display:flex; justify-content:space-between; align-items:flex-start; flex-wrap:wrap; gap:10px; margin-bottom:14px;">
    <div>
      <button type="button" class="btn ghost small" id="workshop-stage-back">‹ Back to all stages</button>
      <h2 style="margin:10px 0 0 0; font-size:19px;">Pre-Processing <span style="color:var(--slate); font-weight:400; font-size:14px;">(${cards.length} pending)</span></h2>
    </div>
    <button type="button" class="btn ghost small workshop-stage-download-btn" data-stage="preprocess">⬇ Download CSV</button>
  </div>`;
  if(cards.length===0) return header + `<div class="card"><div class="empty">Nothing pending in Pre-Processing right now.</div></div>`;
  const groups = {};
  cards.forEach(({order:o,item})=>{
    const t = item.treatmentName || 'No treatment set';
    (groups[t] = groups[t]||[]).push({order:o,item});
  });
  const tiles = Object.entries(groups).sort((a,b)=>b[1].length-a[1].length).map(([t,list])=>
    `<div class="stat open-treatment-btn" data-treatment="${esc(t)}" style="cursor:pointer;"><div class="num serif">${list.length}</div><div class="label">${esc(t)}</div></div>`
  ).join('');
  return header + `<div class="note">Sorted by treatment — open a group to scan and move its items into Processing.</div><div class="stat-row">${tiles}</div>`;
}
function renderWorkshopStagePage(stage){
  if(stage==='preprocess' && !state.workshopTreatmentView) return renderPreprocessTreatmentGroups();
  const isAdmin = hasFullAccess(state.currentStaff.role);
  let cards = workshopStageItems(stage);
  const treatmentScope = stage==='preprocess' ? state.workshopTreatmentView : null;
  if(treatmentScope) cards = cards.filter(({item})=>(item.treatmentName||'No treatment set')===treatmentScope);
  if(!state.workshopStageSelected) state.workshopStageSelected = [];
  if(!state.workshopStageUnlocked) state.workshopStageUnlocked = [];
  const selected = state.workshopStageSelected;
  const unlocked = state.workshopStageUnlocked;
  const keyOf = (o,item)=>`${o.id}::${item.id}`;
  const targetOptions = ACTIVE_STAGES.filter(s=>s!==stage);
  const defaultTarget = targetOptions.includes(nextStage(stage)) ? nextStage(stage) : targetOptions[0];
  // On Pre-Processing, "Move selected to" also offers each treatment/wash type (ITALIAN, ORGANIC,
  // Mending, ...) from DB.treatments. Picking one both re-tags the item with that treatment AND
  // advances it to the next stage (Pressing) — same as picking a plain stage, just with re-tagging.
  // Pull from the treatment names actually sitting on items in this queue right now — not just
  // the treatment catalog — so a soft-deleted or one-off treatment (e.g. "Shoes and Bags" typed
  // directly on an item) still shows up as a move-to option if it's visible in the table below.
  const preprocessTreatmentOptions = stage==='preprocess'
    ? Array.from(new Set(cards.map(({item})=>item.treatmentName).filter(Boolean)))
        .sort((a,b)=>a.localeCompare(b, undefined, {sensitivity:'base', numeric:true}))
    : [];

  const header = `<div style="display:flex; justify-content:space-between; align-items:flex-start; flex-wrap:wrap; gap:10px; margin-bottom:14px;">
    <div>
      <button type="button" class="btn ghost small" id="${treatmentScope?'workshop-treatment-back':'workshop-stage-back'}">‹ Back to ${treatmentScope?'treatments':'all stages'}</button>
      <h2 style="margin:10px 0 0 0; font-size:19px;">${STATUS_LABEL[stage]}${treatmentScope?' · '+esc(treatmentScope):''} <span style="color:var(--slate); font-weight:400; font-size:14px;">(${cards.length} pending)</span></h2>
    </div>
    <button type="button" class="btn ghost small workshop-stage-download-btn" data-stage="${stage}">⬇ Download CSV</button>
  </div>`;

  if(cards.length===0) return header + `<div class="card"><div class="empty">Nothing pending here right now.</div></div>`;

  // Store is the last workshop stage — there's no valid "next stage" to bulk-move into, and the
  // options list below would otherwise fall back to offering earlier stages (e.g. Received) as the
  // pre-selected default, which let staff accidentally send already-finished items backward. Show
  // the safe message instead and point them at the per-item Mark Received / Mark Delivered actions.
  const isLastWorkshopStage = ACTIVE_STAGES.indexOf(stage) === ACTIVE_STAGES.length-1;
  if(targetOptions.length===0 || isLastWorkshopStage){
    return header + `<div class="card"><div class="note" style="margin-top:0;">Items here are already at the last workshop stage — use the "Mark Received"/"Mark Delivered" actions below, or "Move to Delivered" on the Queue board once the whole ticket is ready.</div></div>`;

    <label style="margin:0;">Move selected to</label>
    <select id="workshop-stage-target">${

        ? `<optgroup label="Treatment (re-tag + move to Pressing)">${preprocessTreatmentOptions.map(name=>`<option value="treat:${encodeURIComponent(name)}">${esc(name)}</option>`).join('')}</optgroup><optgroup label="Stage">${targetOptions.map(s=>`<option value="${s}" ${s===defaultTarget?'selected':''}>${STATUS_LABEL[s]}</option>`).join('')}</optgroup>`

            <textarea id="workshop-stage-scan-bulk-input" rows="3" placeholder="Scan several tickets in a row — one ticket number per line" style="width:100%;"></textarea>

          ` : `
            <div style="display:flex; gap:8px; flex-wrap:wrap;">

            <button type="button" class="chip-btn rfid-mode-chip ${rfidMode==='individual'?'on':''}" data-rfidmode="individual">Individually</button>

          ` : `
            <div style="display:flex; gap:8px; flex-wrap:wrap;">
              <input id="workshop-stage-rfid-input" placeholder="Scan one RFID tag, e.g. RV-0001" autocomplete="off" style="flex:1; min-width:220px;">
              <button type="button" class="btn ghost small" id="workshop-stage-rfid-unlock-btn">Unlock</button>
            </div>
          `}
        </div>`:''}
        ${moveControls}
      </div>`;

  const rowHtml = ({order:o, item}, laneIsReady)=>{
    const tagTypes = shopTagTypes[o.shopId] || ['barcode'];
    const tagCode = item.tagId || o.id;
    const tagCell = `<div style="display:flex; flex-direction:column; align-items:center; gap:2px; min-width:100px;">
      ${tagTypes.includes('barcode')?`<div style="width:100px;">${code39Svg(tagCode, 26, 7)}</div>`:''}
      ${tagTypes.includes('rfid')?`<div style="font-size:9px; font-weight:700; letter-spacing:0.5px; border:1px solid #000; border-radius:3px; padding:1px 5px;">RFID</div>`:''}
      <div style="font-size:9px; letter-spacing:0.5px; color:var(--slate);">${esc(tagCode)}</div>
      ${item.tagRegistered?'<div style="font-size:9px; color:var(--ok); font-weight:700;">✓ registered</div>':'<div style="font-size:9px; color:var(--danger);">not registered</div>'}
    </div>`;
    let extraCell = '—';
    if(stage==='preprocess'){
      extraCell = `<select class="row-processing-method-select" data-order="${o.id}" data-item="${item.id}" style="padding:4px 6px; font-size:12px;">
        ${sortAlphaStrings(DB.processingMethods).map(({v:m})=>`<option ${item.processingMethod===m?'selected':''}>${esc(m)}</option>`).join('')}
      </select>`;
    } else if(stage==='prefinish'){
      extraCell = `<select class="row-pressed-by-select" data-order="${o.id}" data-item="${item.id}" style="padding:4px 6px; font-size:12px;">
        <option value="">— Presser —</option>
        ${sortAlphaStrings(DB.pressingStaff).map(({v:p})=>`<option ${item.pressedBy===p?'selected':''}>${esc(p)}</option>`).join('')}
      </select>`;
    } else if(stage==='packing' && DB.shops.length>1){
      extraCell = `<select class="row-store-select" data-order="${o.id}" data-item="${item.id}" style="padding:4px 6px; font-size:12px;">
        ${DB.shops.map(s=>`<option value="${s.id}" ${(item.storeId||o.shopId)===s.id?'selected':''}>${esc(s.name)}</option>`).join('')}
      </select>`;
    }
    const lastCell = laneIsReady
      ? `<button type="button" class="btn small ghost workshop-stage-unready-btn" data-order="${o.id}" data-item="${item.id}">↩ Move back</button>`
      : `<div style="font-size:10.5px; color:var(--slate);">🔒 Scan to move here</div>`;
    return `<tr style="${laneIsReady?'background:var(--ok-bg);':''}">
      <td>${tagCell}</td>
      ${DB.shops.length>1?`<td>${esc(shopName(item.storeId||o.shopId))}</td>`:''}
      <td>${customerNameWithPriority(o.phone, o.customer)}</td>
      <td>${esc(item.name)} ${esc(itemQtyLabel(item))}</td>
      <td>${esc(item.color||'—')}</td>
      <td>${esc(item.grade||'—')}</td>
      <td>${esc(item.treatmentName||'—')}</td>
      <td>${esc(item.defects||'—')}</td>
      <td>${esc(item.packing||'—')}</td>
      <td>${extraCell}</td>
      <td>${fmtDueDate(o.dueDate)}</td>
      <td>${lastCell}</td>
    </tr>`;
  };
  const pendingCards = cards.filter(({order:o,item})=>!(isAdmin || unlocked.includes(keyOf(o,item))));
  const readyCards = cards.filter(({order:o,item})=>isAdmin || unlocked.includes(keyOf(o,item)));
  const pendingRows = pendingCards.map(c=>rowHtml(c,false)).join('');
  const readyRows = readyCards.map(c=>rowHtml(c,true)).join('');
  const colHeaders = `<th>Tag</th>${DB.shops.length>1?'<th>Shop</th>':''}<th>Customer</th><th>Item</th><th>Colour</th><th>Grade</th><th>Treatment</th><th>Defects at intake</th><th>Packing</th><th>${stage==='preprocess'?'Processing method':stage==='prefinish'?'Pressed by':stage==='packing'?'Store':''}</th><th>Date of delivery</th><th></th>`;

  const table = `<div style="display:flex; gap:16px; align-items:flex-start; flex-wrap:wrap; margin-top:14px;">
    <div class="card" style="padding:0; flex:1; min-width:320px;">
      <div style="padding:14px 20px 0 20px;"><h3 style="margin:0;">Pending <span style="color:var(--slate); font-weight:400; font-size:14px;">(${pendingCards.length})</span></h3><div class="note" style="margin:4px 0 0 0;">Scan a tag or ticket above — matching items move to the right automatically.</div></div>
      <div style="padding:12px 20px 16px 20px; overflow-x:auto;">${pendingCards.length===0?'<div class="empty">Nothing left pending — everything here has been scanned.</div>':`<table><thead><tr>${colHeaders}</tr></thead><tbody>${pendingRows}</tbody></table>`}</div>
    </div>
    <div class="card" style="padding:0; flex:1; min-width:320px; border-left:4px solid var(--ok);">
      <div style="padding:14px 20px 0 20px;"><h3 style="margin:0;">✓ Ready to move <span style="color:var(--slate); font-weight:400; font-size:14px;">(${readyCards.length})</span></h3><div class="note" style="margin:4px 0 0 0;">Pick where these go, then move them all at once. Scanned an item by mistake? Use "Move back" to send it left again.</div></div>
      <div style="padding:12px 20px 0 20px; overflow-x:auto;">${readyCards.length===0?'<div class="empty">Nothing scanned yet.</div>':`<table><thead><tr>${colHeaders}</tr></thead><tbody>${readyRows}</tbody></table>`}</div>
      <div style="padding:14px 20px 16px 20px;">${moveControls}</div>
    </div>
  </div>`;

  return header + actionBar + table;
}

// ---------------- Masters (admin) ----------------
// ---------------- Store Arrivals: what Workshop has sent, but this store hasn't scanned in yet ----------------
// Counter Staff have no Workshop or RFID access, so before this page existed they had no way to
// tell "sent from workshop, still in transit with a driver" apart from "actually sitting at the
// counter" — both looked identical (order status = Store) once Packing sent an item onward. This
// page surfaces exactly the gap: every item logically at the Store stage that nobody here has
// confirmed physically arrived (item.storeStatus !== 'received'), scoped to the shop the person is
// looking at (or, for Admin/Super Admin with more than one shop, a shop picker).
function renderStoreArrivals(){
  const role = state.currentStaff.role;
  const isAdmin = hasFullAccess(role);
  let shopId = isAdmin ? (state.storeArrivalsShopId || 'all') : state.currentStaff.shopId;
  if(!isAdmin) shopId = state.currentStaff.shopId;
  const shopPicker = isAdmin && DB.shops.length>1
    ? `<div class="card"><label>Shop</label><select id="storearrivals-shop-filter"><option value="all" ${shopId==='all'?'selected':''}>All shops</option>${DB.shops.map(s=>`<option value="${s.id}" ${shopId===s.id?'selected':''}>${esc(s.name)}</option>`).join('')}</select></div>`
    : '';

  const rows = [];
  state.orders.forEach(o=>{
    if(o.status==='cancelled' || o.status==='delivered') return;
    (o.items||[]).forEach(item=>{
      if(itemStage(item)!=='storedelivery' || item.storeStatus==='received') return;
      const itemShopId = item.storeId || o.shopId;
      if(shopId!=='all' && itemShopId!==shopId) return;
      rows.push({o, item, itemShopId});
    });
  });

  if(rows.length===0){
    return shopPicker + `<div class="card"><div class="empty">Nothing in transit right now — everything sent from the workshop has been received here.</div></div>`;
  }

  const tableRows = rows.map(({o, item, itemShopId})=>`<tr>
    <td><strong>${esc(o.id)}</strong></td>
    <td>${customerNameWithPriority(o.phone, o.customer)}</td>
    <td>${esc(item.name||'')} ${esc(itemQtyLabel(item))}${item.tagId?`<div style="font-size:10px; color:var(--slate);">${esc(item.tagId)}</div>`:''}</td>
    ${isAdmin && DB.shops.length>1 ? `<td>${esc(shopName(itemShopId))}</td>` : ''}
    <td><button type="button" class="btn small store-receive-btn" data-order="${o.id}" data-item="${item.id}">Mark Received</button></td>
  </tr>`).join('');

  return shopPicker + `<div class="card" style="padding:0;">
    <div style="padding:16px 20px 0 20px;"><h3>In transit from the workshop (${rows.length})</h3><div class="note" style="margin-top:4px;">These items have been sent onward by the workshop but nobody has confirmed them physically here yet. Once marked received, they'll show as ready for pickup on the Delivery page.</div></div>
    <div style="padding:0 20px 16px 20px;"><table><thead><tr><th>Ticket</th><th>Customer</th><th>Item</th>${isAdmin && DB.shops.length>1 ? '<th>Shop</th>' : ''}<th></th></tr></thead><tbody>${tableRows}</tbody></table></div>
  </div>`;
}

function renderDeliveryLookup(){
  const phone = (state.deliveryLookupPhone||'').trim();

  const orders = phone ? customerOrderHistory(phone).filter(o=>o.status!=='cancelled') : [];

  const searchCard = `<div class="card">
    <h3>Look up a customer's orders</h3>
    <div class="note">Enter the customer's mobile number to see every order and exactly where it stands — ready for pickup, or still moving through the workshop.</div>
    <div class="row" style="margin-top:10px;">
      <div><label>Mobile number</label><input id="delivery-lookup-phone" placeholder="(555) 010-2200" value="${esc(phone)}"></div>
    </div>
  </div>`;

  if(!phone) return searchCard;

  if(!c){
    return searchCard + `<div class="card"><div class="empty">No customer found with this mobile number.</div></div>`;
  }

  const due = customerDueBalance(c.phone);
  const custCard = `<div class="card" style="border-left:4px solid var(--teal);">
    <div style="display:flex; justify-content:space-between; flex-wrap:wrap; gap:8px; align-items:center;">
      <div><strong style="font-size:16px;">${esc(c.name)}</strong> ${priorityBadge(c.phone)} ${statusBadge(c.phone)}</div>
      ${due>0?`<div style="color:var(--danger); font-weight:700;">Due: ${money(due)}</div>`:'<div style="color:var(--ok); font-weight:600;">No dues</div>'}
    </div>
    ${c.address?`<div class="note" style="margin-top:4px;">${esc(c.address)}${c.area?', '+esc(c.area):''}</div>`:''}
  </div>`;

  if(orders.length===0){
    return searchCard + custCard + `<div class="card"><div class="empty">No orders found for this customer.</div></div>`;
  }

  const stageOrder = STATUS.filter(s=>s!=='delivered'); // received..storedelivery — the workshop pipeline
  const orderCards = orders.map(o=>{
    const isReady = orderReceivedAtStore(o);
    const isInTransit = o.status==='storedelivery' && !isReady;
    const isDelivered = o.status==='delivered';
    const service = DB.services.find(s=>s.id===o.serviceId);
    const stageIdx = stageOrder.indexOf(o.status);
    const stageChecklist = stageOrder.map((s,idx)=>{
      const passed = isDelivered || (stageIdx>=0 && idx<stageIdx);
      const current = !isDelivered && idx===stageIdx;
      const icon = passed ? '✅' : current ? '🔵' : '⚪';
      return `<div style="display:flex; align-items:center; gap:6px; padding:3px 0;"><span>${icon}</span><span style="${current?'font-weight:700;':''} ${passed&&!current?'color:var(--slate);':''}">${STATUS_LABEL[s]}</span></div>`;
    }).join('');
    const statusBanner = isReady
      ? `<div style="background:var(--ok-bg); color:var(--ok); font-weight:700; padding:8px 12px; border-radius:6px; display:inline-block;">✅ READY FOR PICKUP</div>`
      : isInTransit
        ? `<div style="background:var(--info-bg); color:var(--info); font-weight:700; padding:8px 12px; border-radius:6px; display:inline-block;">🚚 Sent from workshop — not yet received at this store</div>`
        : isDelivered
        ? `<div style="background:#EEE; color:var(--slate); font-weight:700; padding:8px 12px; border-radius:6px; display:inline-block;">Already delivered to customer</div>`
        : `<div style="background:var(--wait-bg); color:var(--wait); font-weight:700; padding:8px 12px; border-radius:6px; display:inline-block;">⏳ In progress — currently at: ${STATUS_LABEL[o.status]}</div>`;
    return `<div class="card" style="border-left:4px solid ${isReady?'var(--ok)':isInTransit?'var(--info)':isDelivered?'var(--slate)':'var(--brass)'};">
      <div style="display:flex; justify-content:space-between; flex-wrap:wrap; gap:6px; align-items:center;">
        <strong>${esc(o.id)}</strong>
        <span style="font-size:12.5px; color:var(--slate);">${new Date(o.createdAt).toLocaleString()}</span>
        <span class="pill ${o.status}">${STATUS_LABEL[o.status]}</span>
      </div>

// A ticket counts as "invoiced" once it has been delivered or has an invoice raised against it
// (payment marked). Normal Admin-tier staff can no longer edit, cancel, or delete a ticket once
// it reaches this point — only Super Admin can, from here on.
function orderIsInvoiced(o){
  return o.status==='delivered' || DB.invoices.some(inv=>inv.orderId===o.id);
}
function renderMasterOrdersMaster(){
  const myRole = state.currentStaff ? state.currentStaff.role : '';

  const q = (state.masterOrdersSearch||'').trim().toLowerCase();
  const statusFilter = state.masterOrdersStatusFilter || 'all';
  const fromDate = state.masterOrdersFrom || '';
  const toDate = state.masterOrdersTo || '';
  const shopFilter = state.masterOrdersShopFilter || 'all';
  let orders = state.orders.slice().sort((a,b)=>b.createdAt.localeCompare(a.createdAt));
  if(q){
    orders = orders.filter(o=>
      o.id.toLowerCase().includes(q) ||
      (o.customer||'').toLowerCase().includes(q) ||
      (o.phone||'').toLowerCase().includes(q) ||
      (o.address||'').toLowerCase().includes(q) ||
      (o.area||'').toLowerCase().includes(q)
    );
  }
  if(statusFilter!=='all') orders = orders.filter(o=>statusFilter==='active' ? (o.status!=='delivered' && o.status!=='cancelled') : o.status===statusFilter);
  if(fromDate) orders = orders.filter(o=>o.createdAt.slice(0,10) >= fromDate);
  if(toDate) orders = orders.filter(o=>o.createdAt.slice(0,10) <= toDate);
  if(shopFilter!=='all') orders = orders.filter(o=>String(o.shopId)===String(shopFilter));

  const cancellingId = state.cancellingOrderId;
  const deletingId = state.deletingOrderId;
  const statusOptions = ['all','active'].concat(STATUS).concat(['cancelled']);

    const invoiced = orderIsInvoiced(o);
    // Once a ticket has been saved, only Admin/Super Admin may still edit or cancel it — Counter

function renderCashDepositsLedger(){

  const shopId = locked ? state.currentStaff.shopId : (state.ledgerDepositShop || 'all');
  const deposits = (DB.cashDeposits||[]).filter(d=>

  ).sort((a,b)=>b.createdAt.localeCompare(a.createdAt));

  const cashCollected = invoices.reduce((s,i)=>s+i.amount,0);
  const totalDeposited = deposits.reduce((s,d)=>s+d.amount,0);
  const pendingDeposit = cashCollected - totalDeposited;
  const staffPool = locked ? DB.staff.filter(s=>!s.deletedAt && s.shopId===state.currentStaff.shopId) : DB.staff.filter(s=>!s.deletedAt);
  const staffOptions = staffPool.map(s=>`<option value="${s.id}" ${locked&&s.id===state.currentStaff.id?'selected':''}>${esc(s.name)}</option>`).join('');
  const shopOptions = DB.shops.map(s=>`<option value="${s.id}" ${locked&&s.id===shopId?'selected':''}>${esc(s.name)}</option>`).join('');
  const rows = deposits.map(d=>`<tr>

function customerLedgerBalances(shopId){
  const byPhone = {};
  (DB.customerLedger||[]).filter(e=>!shopId || e.shopId===shopId).forEach(e=>{
    if(!byPhone[e.phone]) byPhone[e.phone] = {phone:e.phone, customerName:e.customerName, charged:0, paid:0, lastAt:e.createdAt};
    const b = byPhone[e.phone];
    if(e.type==='charge') b.charged += e.amount; else b.paid += e.amount;
    if(e.customerName) b.customerName = e.customerName;
    if(e.createdAt > b.lastAt) b.lastAt = e.createdAt;
  });
  return Object.values(byPhone).map(b=>Object.assign(b, {balance: b.charged - b.paid}));
}

// A general-ledger-style view of expenses: grouped by Account Head, with a drill-down into every
