function ensureAccountHeadLedgerDefaults(){
  if(!state.ahlFrom) state.ahlFrom = addDays(todayISO(), -30);
  if(!state.ahlTo) state.ahlTo = todayISO();
  if(!state.ahlShop) state.ahlShop = 'all';
  if(isEntryOnlyStaff()) state.ahlShop = state.currentStaff.shopId || state.ahlShop;
}
function renderAccountHeadLedger(){
  ensureAccountHeadLedgerDefaults();
  const shopId = state.ahlShop;
  const expenses = (DB.expenses||[]).filter(e=>
    e.date>=state.ahlFrom && e.date<=state.ahlTo && (shopId==='all'||e.shopId===shopId)
  );
  const byHead = {};
  expenses.forEach(e=>{
    const h = e.category || 'Uncategorized';
    if(!byHead[h]) byHead[h] = {head:h, total:0, cash:0, count:0};
    byHead[h].total += e.amount; byHead[h].count++;
    if((e.paymentMode||'').toLowerCase()==='cash') byHead[h].cash += e.amount;
  });
  const heads = Object.values(byHead).sort((a,b)=>b.total-a.total);
  const grandTotal = expenses.reduce((s,e)=>s+e.amount,0);
  const selectedHead = state.ahlSelectedHead;

  const headRows = heads.map(h=>`<tr class="${selectedHead===h.head?'active-row':''}" style="${selectedHead===h.head?'background:#F4F9F8;':''}">
    <td><button type="button" class="link-btn ahl-select-head" data-head="${esc(h.head)}">${esc(h.head)}</button></td>
    <td>${h.count}</td><td>${money(h.cash)}</td><td>${money(h.total)}</td>
    <td>${grandTotal>0?Math.round(h.total/grandTotal*100):0}%</td>
  </tr>`).join('');

  let detailHtml = '';
  if(selectedHead){
    const entries = expenses.filter(e=>(e.category||'Uncategorized')===selectedHead).sort((a,b)=>b.createdAt.localeCompare(a.createdAt));
    const entryRows = entries.map(e=>`<tr>
      <td>${fmtDate(e.date)}</td><td>${esc(shopName(e.shopId))}</td><td>${esc(e.description||'—')}</td>
      <td>${esc(e.paymentMode||'Cash')}</td><td>${money(e.amount)}</td><td>${esc(e.createdBy||'—')}</td>
    </tr>`).join('');
    const headTotal = heads.find(h=>h.head===selectedHead);
    detailHtml = `<div class="card">
      <h3 style="margin-top:0;">${esc(selectedHead)} — ${money(headTotal?headTotal.total:0)}</h3>
      ${entries.length===0?'<div class="empty">No transactions.</div>':
      `<table><thead><tr><th>Date</th><th>Shop</th><th>Details</th><th>Paid via</th><th>Amount</th><th>Logged by</th></tr></thead><tbody>${entryRows}</tbody></table>`}
    </div>`;
  }

  return `<div class="note">Every expense booked from the Daily Account Master, grouped by Account Head (like a general ledger) — click a head to see its individual transactions.${isEntryOnlyStaff()?'':' Manage the list of heads under Setup → Account Heads.'}</div>
  <div class="card" style="padding:14px 20px;">
    <div class="row" style="align-items:flex-end; flex-wrap:wrap;">
      <div style="max-width:180px;"><label>From</label><input type="date" id="ahl-from" value="${state.ahlFrom}"></div>
      <div style="max-width:180px;"><label>To</label><input type="date" id="ahl-to" value="${state.ahlTo}"></div>
      <div style="max-width:200px;"><label>Shop</label>${isEntryOnlyStaff()?`<input value="${esc(shopName(shopId))}" disabled>`:`<select id="ahl-shop-filter"><option value="all" ${shopId==='all'?'selected':''}>All shops</option>${DB.shops.map(s=>`<option value="${s.id}" ${shopId===s.id?'selected':''}>${esc(s.name)}</option>`).join('')}</select>`}</div>
    </div>
  </div>
  <div class="stat-row"><div class="stat"><div class="num serif">${money(grandTotal)}</div><div class="label">Total expenses in range</div></div><div class="stat"><div class="num serif">${heads.length}</div><div class="label">Account heads used</div></div></div>
  <div class="card" style="padding:0;">
    <div style="padding:16px 20px 0 20px;"><h3>By account head</h3></div>
    <div style="padding:0 20px 16px 20px; overflow-x:auto;">${heads.length===0?'<div class="empty">No expenses in this range.</div>':
    `<table><thead><tr><th>Account head</th><th>Entries</th><th>Cash</th><th>Total</th><th>Share</th></tr></thead><tbody>
    ${headRows}
    <tr style="font-weight:600; background:#F7FAF9;"><td>Total</td><td>${expenses.length}</td><td>${money(expenses.filter(e=>(e.paymentMode||'').toLowerCase()==='cash').reduce((s,e)=>s+e.amount,0))}</td><td>${money(grandTotal)}</td><td>100%</td></tr>
    </tbody></table>`}
    </div>
  </div>
  ${detailHtml}`;
}

function pricingSetupSteps(){

    {key:'itemdescriptions', tab:'itemdescriptions', label:'Item Description', hint:'Add at least one item name (e.g. Shirt, Saree).', done: DB.itemDescriptions.length>0},
    {key:'treatments', tab:'treatments', label:'Treatment', hint:'Add at least one treatment/wash type.', done: DB.treatments.length>0},
    {key:'itemgrades', tab:'itemgrades', label:'Item Grade', hint:'Add at least one pricing tier (e.g. Standard).', done: DB.itemGrades.length>0}
  ];

function renderPricingSetupGate(steps){
  const firstMissingIdx = steps.findIndex(s=>!s.done);
  const rows = steps.map((s,i)=>{
    let status;
    if(s.done) status = `<span class="pill packing">✓ Done</span>`;
    else if(i===firstMissingIdx) status = `<span class="pill received">Do this next</span>`;
    else status = `<span class="pill" style="background:#EEE; color:var(--slate);">Waiting</span>`;
    const disabled = i>firstMissingIdx ? 'disabled title="Complete the earlier step first"' : '';
    return `<tr>
      <td style="font-weight:600;">${i+1}. ${esc(s.label)}</td>
      <td style="color:var(--slate); font-size:12.5px;">${esc(s.hint)}</td>
      <td>${status}</td>
      <td>${s.done?'':`<button type="button" class="btn small go-to-master-step" data-tab="${s.tab}" ${disabled}>Go to ${esc(s.label)}</button>`}</td>
    </tr>`;
  }).join('');
  return `<div class="card">
    <h3>Set up pricing masters in order</h3>
    <div class="note" style="margin-bottom:14px;">Before you can add booking items or pricing (the same price list is used for every store), complete these in order: Item Categories → Item Description → Treatment → Item Grade.</div>
    <table><thead><tr><th>Step</th><th>What's needed</th><th>Status</th><th></th></tr></thead><tbody>${rows}</tbody></table>
  </div>`;
}

function renderPricingGrid(){
  const isAdmin = hasFullAccess(state.currentStaff.role);

  const garments = DB.garments;
  const treatments = sortByName(DB.treatments).filter(t=>!t.manualPrice && !t.deletedAt);
  const sortedCategories = sortAlphaStrings(DB.itemCategories).map(x=>x.v);
  const activeCategory = (state.pricingCategory && (sortedCategories.includes(state.pricingCategory) || state.pricingCategory==='Uncategorized')) ? state.pricingCategory : '';
  const categoryRows = (categoryLabel, list)=> list.length===0 ? '' : `<tr><td colspan="${treatments.length+2}" style="background:#F2F6F4; font-weight:600; padding:8px 10px;">${esc(categoryLabel)}</td></tr>` +
    sortByName(list).map(g=>`<tr><td>${esc(g.name)}${g.pricingMode&&g.pricingMode!=='piece'?` <span style="color:var(--slate); font-size:11px;">(${esc(pricingModeLabel(g.pricingMode))})</span>`:''}${itemDescUnitType(g.name)==='pair'?` <span style="color:var(--brass); font-size:11px; font-weight:600;">(Pair/set)</span>`:''}</td><td><input class="pricing-cell" data-garment="${g.id}" data-treatment="${BASE_TREATMENT_KEY}" data-grade="${esc(activeGrade)}" type="number" step="0.01" min="0" value="${garmentBasePrice(g.id,activeGrade)}" style="width:90px;" ${isAdmin?'':'disabled title="Only an Admin can change service pricing"'}></td>${treatments.map(t=>`<td><input class="pricing-cell" data-garment="${g.id}" data-treatment="${t.id}" data-grade="${esc(activeGrade)}" type="number" step="0.01" min="0" value="${garmentTreatmentPrice(g.id,t.id,activeGrade)}" style="width:90px;" ${isAdmin?'':'disabled title="Only an Admin can change service pricing"'}></td>`).join('')}</tr>`).join('');
  let bodyRows = '';

function buildPriceListRows(){
  const garments = sortByName(DB.garments);
  const treatments = sortByName(DB.treatments).filter(t=>!t.manualPrice && !t.deletedAt);
  const grades = sortAlphaStrings(DB.itemGrades).map(x=>x.v);
  const rows = garments.map(g=>{
    const category = (g.category && DB.itemCategories.includes(g.category)) ? g.category : 'Uncategorized';
    return {
      category, item:g.name, garmentId:g.id,
      basePrices: grades.map(grade=>({grade, price: garmentBasePrice(g.id,grade)})),
      treatmentPrices: treatments.map(t=>({
        name: t.name,
        gradePrices: grades.map(grade=>({grade, price: garmentBasePrice(g.id,grade)+garmentTreatmentPrice(g.id,t.id,grade)}))
      }))
    };
  });
  return {treatments, grades, rows};
}
function downloadPriceListCsv(){
  const {treatments, grades, rows} = buildPriceListRows();
  const header = ['Category','Item'].concat(treatments.flatMap(t=>grades.map(grade=>`${t.name} (${grade})`)));
  const lines = [header.join(',')].concat(rows.map(r=>[r.category,r.item].concat(r.treatmentPrices.flatMap(tp=>tp.gradePrices.map(gp=>gp.price.toFixed(2)))).map(csvEscape).join(',')));
  const csv = lines.join('\n');
  const blob = new Blob([csv], {type:'text/csv;charset=utf-8;'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = `price-list.csv`;
  document.body.appendChild(a); a.click(); document.body.removeChild(a);
  URL.revokeObjectURL(url);
}
function priceListExcelHeader(treatments, grades){
  return ['Category','Item'].concat(treatments.flatMap(t=>grades.map(grade=>`${t.name} (${grade})`)));
}
function downloadPriceListExcel(){
  const {treatments, grades, rows} = buildPriceListRows();
  const header = priceListExcelHeader(treatments, grades);
  const aoa = [header].concat(rows.map(r=>{
    const treatmentCells = r.treatmentPrices.flatMap(tp=>tp.gradePrices.map(gp=>Number(gp.price.toFixed(2))));
    return [r.category, r.item].concat(treatmentCells);
  }));
  const ws = XLSX.utils.aoa_to_sheet(aoa);
  const wb = XLSX.utils.book_new();
  XLSX.utils.book_append_sheet(wb, ws, 'Price List');
  XLSX.writeFile(wb, `price-list-${todayISO()}.xlsx`);
}
function importPriceListFromRows(rows){
  ensureMatrix();
  const treatments = DB.treatments.filter(t=>!t.manualPrice && !t.deletedAt);
  const grades = DB.itemGrades;
  const norm = s=>String(s).trim().toLowerCase();
  const findVal = (row, header)=>{
    const keys = Object.keys(row);
    const k = keys.find(k=>norm(k)===norm(header));
    return k!==undefined ? row[k] : undefined;
  };
  let itemsMatched = 0, itemsCreated = 0, categoriesCreated = 0, cellsUpdated = 0;
  const skippedRows = [];
  rows.forEach(row=>{
    const itemNameRaw = findVal(row,'Item') ?? findVal(row,'Item Name') ?? findVal(row,'Description') ?? findVal(row,'Garment');
    const itemName = itemNameRaw!==undefined ? String(itemNameRaw).trim() : '';
    if(!itemName) return;
    const categoryRaw = findVal(row,'Category');
    const categoryTyped = categoryRaw!==undefined ? String(categoryRaw).trim() : '';
    // Resolve to an existing category case-insensitively; if it's genuinely new, add it to the master list.
    let category = '';
    if(categoryTyped){
      const existingCat = DB.itemCategories.find(c=>norm(c)===norm(categoryTyped));
      category = existingCat || categoryTyped;
      if(!existingCat){ DB.itemCategories.push(category); categoriesCreated++; }
    }
    // Prefer a name+category match (so items that legitimately exist under more than one category,
    // e.g. "Shirt" in both Mens and Kids, land on the right row), falling back to a name-only match.
    let garment = category ? DB.garments.find(g=>norm(g.name)===norm(itemName) && norm(g.category||'')===norm(category)) : null;
    if(!garment) garment = DB.garments.find(g=>norm(g.name)===norm(itemName) && (!category || !g.category));
    if(!garment){
      // No matching Booking Item yet — create one instead of skipping the row, so a full price
      // list (categories, items and prices together) can be imported in a single pass.
      garment = {id:genItemId(), name:itemName, category, pricingMode:'piece', price:0};
      DB.garments.push(garment);
      itemsCreated++;
      if(!DB.itemDescriptions.some(d=>norm(itemDescName(d))===norm(itemName))){
        DB.itemDescriptions.push({name:itemName, unitType:'piece'});
      }
      ensureMatrix();
    }
    itemsMatched++;
    let rowHadPrice = false;
    treatments.forEach(t=>{
      grades.forEach(grade=>{
        const v = findVal(row, `${t.name} (${grade})`);
        if(v!==undefined && String(v).trim()!==''){
          const val = parseFloat(v);
          if(!isNaN(val)){
            rowHadPrice = true;
            const base = garmentBasePrice(garment.id, grade);
            if(!DB.treatmentPricing[grade]) DB.treatmentPricing[grade] = {};
            if(!DB.treatmentPricing[grade][garment.id]) DB.treatmentPricing[grade][garment.id] = {};
            DB.treatmentPricing[grade][garment.id][t.id] = val - base;
            cellsUpdated++;
          }
        }
      });
    });
    if(!rowHadPrice) skippedRows.push(itemName);
  });
  return {itemsMatched, itemsCreated, categoriesCreated, skippedRows, cellsUpdated};
}

function renderCloudSyncMaster(){
  const cfg = getSavedFirebaseConfig();
  const mode = state.storageMode;
  const statusCard = mode==='firestore'
    ? `<div class="note" style="border-left-color:var(--ok); background:var(--ok-bg); color:var(--ok);">✓ Connected — this device is sharing live data with every other device using the same Cloud Sync setup below.${cfg&&cfg.projectId?' Project: <strong>'+esc(cfg.projectId)+'</strong>':''}</div>`
    : (cfg ? `<div class="note" style="border-left-color:var(--danger); background:var(--danger-bg); color:var(--danger);">⚠ A Cloud Sync setup is saved on this device, but it couldn't connect just now (check your internet connection, or the project details below).</div>`
           : `<div class="note">Not set up yet — this device is currently saving only to itself (${mode==='local'?'this browser':'nowhere — saving is broken'}). Follow the steps below once to share data across every device.</div>`);
  return `<div class="note">Cloud Sync lets every till, phone, and computer share the exact same live orders, pricing, and customers — instead of each device keeping its own separate copy. It's powered by a free Google Firebase project you set up once.</div>
  <div class="note" style="border-left-color:var(--brass);">Good to know: each shop's data is synced as a single record, and Firestore's free plan caps each record at 1MB — plenty for a long while (thousands of customers/orders), but if a shop grows very large, older order history may eventually need archiving. Keep downloading periodic backups under Data Backup either way.</div>
  ${statusCard}
  <div class="card">
    <h3>One-time setup (do this once, on any one device)</h3>
    <ol style="font-size:13.5px; line-height:1.9; color:var(--ink); padding-left:20px; margin:0;">
      <li>Go to <strong>console.firebase.google.com</strong> and sign in with any Google account.</li>
      <li>Click <strong>Add project</strong>, give it any name (e.g. "Pressed Shop"), and finish creating it (Google Analytics is not needed — you can turn it off).</li>
      <li>In the left menu open <strong>Build → Firestore Database</strong>, click <strong>Create database</strong>, and choose <strong>Start in test mode</strong> (pick any region close to you).</li>
      <li>Still in Firestore, open the <strong>Rules</strong> tab and replace the rules with the block below, then click <strong>Publish</strong>:
        <pre style="background:#F2F6F4; border:1px solid var(--line); border-radius:4px; padding:10px; font-size:11.5px; overflow-x:auto; margin:6px 0;">rules_version = '2';
service cloud.firestore {
  match /databases/{database}/documents {
    match /{document=**} {
      allow read, write: if true;
    }
  }
}</pre>
        <span style="color:var(--slate);">This keeps things simple for a small internal tool — anyone who has your config below can read/write this database, so don't publish it publicly.</span>
      </li>
      <li>Back at the project home, click the <strong>&lt;/&gt; (Web)</strong> icon to register a web app, give it any nickname, and skip Firebase Hosting.</li>
      <li>Firebase will show a code block starting with <code>const firebaseConfig = { ... }</code>. Copy just the <strong>{ ... }</strong> part and paste it below.</li>
    </ol>
  </div>
  <div class="card">
    <h3>Connect this device</h3>
    <div class="note">Paste the same config on every phone/computer you want sharing data. Whoever set it up first can copy it below to hand to the others.</div>
    <form id="cloudsync-form">
      <label>Firebase config</label>
      <textarea name="config" rows="7" placeholder='{
  apiKey: "AIza...",
  authDomain: "your-project.firebaseapp.com",
  projectId: "your-project",
  storageBucket: "your-project.appspot.com",
  messagingSenderId: "...",
  appId: "..."
}'>${cfg?esc(JSON.stringify(cfg, null, 2)):''}</textarea>
      <div style="margin-top:14px; display:flex; gap:10px; flex-wrap:wrap;">
        <button class="btn" type="submit">Save &amp; connect</button>
        ${cfg?'<button type="button" class="btn ghost" id="cloudsync-copy">Copy config to share</button><button type="button" class="btn danger" id="cloudsync-disconnect">Disconnect this device</button>':''}
      </div>
    </form>
  </div>`;
}

// Dual-scan lock: NOTHING can be moved from any stage until it has been confirmed by BOTH an
// RFID scan and a barcode scan of the same tag/ticket. This applies to every role — workshop
// staff, supervisors and admins alike — there is no manual override or bypass anywhere below.
function ensureDualScan(stage){
  if(!state.dualScan) state.dualScan = {};
  if(!state.dualScan[stage]) state.dualScan[stage] = {rfid:[], barcode:[]};
  return state.dualScan[stage];
}
function dualHas(list, orderId, itemId){ return (list||[]).some(m=>m.orderId===orderId && m.itemId===itemId); }
function dualReady(stage, orderId, itemId){
  if(hasFullAccess(state.currentStaff.role)) return true; // Admin/Super Admin are never locked out at any stage
  const d = ensureDualScan(stage);
  return dualHas(d.rfid, orderId, itemId) || dualHas(d.barcode, orderId, itemId);
}

function rfidMatchesPanel(stage){
  const d = ensureDualScan(stage);
  const seen = {};
  const union = [];
  [...d.rfid, ...d.barcode].forEach(m=>{
    const key = m.orderId+'__'+m.itemId;
    if(!seen[key]){ seen[key]=true; union.push(m); }
  });
  if(union.length===0) return '';
  const rows = union.map(m=>{
    const o = state.orders.find(o=>o.id===m.orderId); if(!o) return '';
    const item = (o.items||[]).find(i=>i.id===m.itemId); if(!item) return '';
    return rfidMatchRow(stage, o, item);
  }).join('');
  const readyCount = union.filter(m=>dualReady(stage, m.orderId, m.itemId)).length;
  return `<div class="card">
    <h3 style="margin:0 0 10px 0;">Scanned — ${union.length} item${union.length===1?'':'s'} · ${readyCount} unlocked</h3>

  </div>`;
}

// ---- RFID Scan Station: scan resolution + actions ----
// channel is 'rfid' or 'barcode'. An item only becomes actionable once it has appeared in BOTH
// channel lists for this stage (see dualReady) — one scanner alone is never enough.
function rfidResolveScan(stage, rawCode, channel){
  const d = ensureDualScan(stage);
  const chLabel = channel==='rfid' ? 'RFID' : 'Barcode';
  const trimmed = (rawCode||'').trim();
  if(!trimmed){ state.rfidScanMsg = {stage, ok:false, text:`Scan or type a tag/ticket number into the ${chLabel} line first.`}; return; }
  const found = findByScannedCode(trimmed);
  if(!found){ state.rfidScanMsg = {stage, ok:false, text:`${chLabel} scan: no item or ticket found for "${trimmed}".`}; return; }
  let matches = [];
  if(found.item){
    if(itemStage(found.item)===stage){ matches = [{orderId:found.order.id, itemId:found.item.id}]; }
    else { state.rfidScanMsg = {stage, ok:false, text:`${chLabel} scan: ${found.item.tagId||trimmed} is currently at ${STATUS_LABEL[itemStage(found.item)]}, not ${RFID_STAGE_TITLE[stage]}.`}; return; }
  } else {
    matches = (found.order.items||[]).filter(i=>itemStage(i)===stage).map(i=>({orderId:found.order.id, itemId:i.id}));
    if(matches.length===0){ state.rfidScanMsg = {stage, ok:false, text:`${chLabel} scan: no items on ticket ${found.order.id} are currently at ${RFID_STAGE_TITLE[stage]}.`}; return; }
  }
  matches.forEach(m=>{ if(!dualHas(d[channel], m.orderId, m.itemId)) d[channel].push(m); });
  state.rfidScanMsg = {stage, ok:true, text:`${chLabel} scan matched — ${matches.length} item${matches.length===1?'':'s'} unlocked at ${RFID_STAGE_TITLE[stage]}.`};
}
async function rfidApplyAction(stage, orderId, itemId, action, extraVal, extraVal2){
  const o = state.orders.find(o=>o.id===orderId); if(!o) return;
  const item = (o.items||[]).find(i=>i.id===itemId); if(!item) return;
  if(!dualReady(stage, orderId, itemId)){
    showToast('🔒 Locked — scan this item\'s RFID tag or barcode first before it can be moved.');
    return;
  }
  if(stage==='storedelivery' && action==='deliver' && extraVal==='Delivery Boy' && !extraVal2){
    showToast('Pick which delivery boy this is going out with first.'); return;
  }
  const from = STATUS_LABEL[itemStage(item)];
  if(stage==='preprocess' && action==='advance'){
    item.processingMethod = extraVal || RFID_PREPROCESS_OPTIONS[0];
    item.stage = 'processing';
    logRfidAction(item, 'Sent to Pressing', item.processingMethod);
  } else if(stage==='processing' && action==='advance'){
    item.pressedBy = extraVal || RFID_PRESSMEN[0];
    item.stage = 'prefinish';
    logRfidAction(item, 'Sent to Pre-Finishing', `Pressed by ${item.pressedBy}`);
  } else if(stage==='prefinish' && action==='send'){
    item.prefinishOption = extraVal || item.prefinishOption || RFID_PREFINISH_OPTIONS[0];
    item.prefinishStatus = 'sent';
    logRfidAction(item, `Sent out for ${item.prefinishOption}`, '');
  } else if(stage==='prefinish' && action==='receive'){
    item.prefinishOption = extraVal || item.prefinishOption || RFID_PREFINISH_OPTIONS[0];
    item.prefinishStatus = 'received';
    item.stage = 'packing';
    logRfidAction(item, `Received back from ${item.prefinishOption} — sent to Packing`, '');
  } else if(stage==='packing' && action==='receive'){
    item.packerName = extraVal || item.packerName || '';
    item.finishStatus = 'received';
    logRfidAction(item, 'Received at Packing', `Packer: ${item.packerName||'—'}`);
  } else if(stage==='packing' && action==='advance'){
    item.packerName = extraVal || item.packerName || '';
    if(extraVal2) item.storeId = extraVal2;
    item.stage = 'storedelivery';
    item.finishStatus = 'sent';
    logRfidAction(item, 'Sent to Store', `Packed by ${item.packerName||'—'}${item.storeId?' · '+shopName(item.storeId):''}`);
  } else if(stage==='storedelivery' && action==='receive'){
    item.storeStatus = 'received';
    logRfidAction(item, 'Received at Store', shopName(item.storeId||o.shopId));
  } else if(stage==='storedelivery' && action==='deliver'){
    item.storeStatus = 'delivered';
    item.deliveredTo = extraVal || 'Customer';
    item.deliveryBoyName = item.deliveredTo==='Delivery Boy' ? extraVal2 : '';
    logRfidAction(item, `Delivered to ${item.deliveredTo}`, item.deliveryBoyName||'');
  } else { return; }
  const to = STATUS_LABEL[itemStage(item)];
  if(to !== from){
    item.stageLog = item.stageLog || [];
    item.stageLog.push({from, to, method:'RFID scan', by:state.currentStaff.name, at:new Date().toISOString()});
  }
  recomputeOrderStage(o);
  const d = ensureDualScan(stage);
  d.rfid = d.rfid.filter(m=>!(m.orderId===orderId && m.itemId===itemId));
  d.barcode = d.barcode.filter(m=>!(m.orderId===orderId && m.itemId===itemId));
  await saveOrders();
  showToast(`${(item.name||'Item')} (${o.id}) updated via RFID — ${RFID_STAGE_TITLE[stage]}.`);
  render();
}
function bindRfidHandlers(){
  if(state.view!=='rfid') return;
  const stage = rfidStageFromTab(state.tab);
  ['rfid','barcode'].forEach(channel=>{
    const input = document.getElementById(`rfid-scan-input-${channel}`);
    if(input){
      if(channel==='rfid') input.focus();
      const doScan = ()=>{ rfidResolveScan(stage, input.value, channel); input.value=''; render(); };
      input.onkeydown = (e)=>{ if(e.key==='Enter'){ e.preventDefault(); doScan(); } };
    }
  });
  document.querySelectorAll('.rfid-scan-btn').forEach(btn=>{
    btn.onclick = ()=>{
      const channel = btn.dataset.channel;
      const inp = document.getElementById(`rfid-scan-input-${channel}`);
      rfidResolveScan(stage, inp?inp.value:'', channel);
      if(inp) inp.value='';
      render();
    };
  });
  document.querySelectorAll('.rfid-scan-clear').forEach(btn=>{
    btn.onclick = ()=>{
      const channel = btn.dataset.channel;
      const d = ensureDualScan(stage);
      d[channel] = [];
      state.rfidScanMsg = null;
      const inp = document.getElementById(`rfid-scan-input-${channel}`);
      if(inp) inp.value='';
      render();
    };
  });
  if(document.getElementById('rfid-scan-clear-all')){
    document.getElementById('rfid-scan-clear-all').onclick = ()=>{
      state.dualScan = state.dualScan || {}; state.dualScan[stage] = {rfid:[], barcode:[]};
      state.rfidScanMsg = null;
      render();
    };

  if(document.getElementById('report-from')){

      const scope = document.getElementById('itemstatus-download-btn').dataset.scope || null;
      downloadItemStatusCSV(scope || null);

  bindRfidHandlers();
  if(state.view==='shop' && state.tab==='new' && document.getElementById('order-form')){
    const shopId = state.activeShop;
    renderItemsWrap(shopId);
    updateTicketPreview(shopId);
    document.getElementById('add-item').onclick = ()=>{ draftItems.push(blankDraftItem()); renderItemsWrap(shopId); updateTicketPreview(shopId); };
    bindQuickAddBar(shopId);

    }
    if(document.getElementById('cancel-edit-order')){
      document.getElementById('cancel-edit-order').onclick = ()=>{
        state.editingOrderId = null; draftItems = []; draftOrderMeta = {};
        state.tab='orders'; render();
      };
    }
    const form = document.getElementById('order-form');
    // Enter should move to the next field — never leave anything required to be typed if it's
    // optional, just carry on to the next box, same as Tab — instead of quietly submitting the whole
    // ticket early. The four search fields (Category/Grade/Treatment/Item description) already manage
    // their own Enter behaviour above (they may need to confirm a match first), so this only handles
    // the rest of the form.
    form.addEventListener('keydown', (e)=>{
      if(e.key!=='Enter') return;
      const t = e.target;
      const tag = (t.tagName||'').toUpperCase();
      if(tag==='TEXTAREA') return; // let Enter add a new line in the Notes box
      if(tag==='BUTTON') return; // leave buttons/chips to their normal Enter/Space behaviour
      if(t.classList && (t.classList.contains('it-category-search') || t.classList.contains('it-grade-search') || t.classList.contains('it-treatment-search') || t.classList.contains('it-description-search'))) return;
      e.preventDefault();
      const focusables = Array.from(form.querySelectorAll('input, select, textarea, button')).filter(el=>!el.disabled && el.offsetParent!==null);
      const at = focusables.indexOf(t);
      if(at>=0 && at+1<focusables.length){
        const next = focusables[at+1];
        next.focus({preventScroll:true});
        if(next.tagName==='INPUT'){ try{ next.select(); }catch(err){} }
      }
    });
    // Arrow-key navigation, spreadsheet-style, so the whole ticket can be filled without ever
    // reaching for the mouse: Left/Right step to the previous/next field (like Tab / Shift+Tab),
    // and Up/Down jump to the SAME field one garment row up or down — e.g. Down from Qty on garment 1
    // lands on Qty on garment 2 — falling back to plain previous/next field when there's no row above
    // or below, or no matching field there. Selects and the Notes textarea keep their normal arrow-key
    // behaviour (changing the selected option / moving the text cursor). Inside a text box, Left/Right
    // only jump fields once the cursor is already at that end of the text, so normal cursor movement
    // and text selection still works while typing.
    form.addEventListener('keydown', (e)=>{
      const key = e.key;
      if(key!=='ArrowUp' && key!=='ArrowDown' && key!=='ArrowLeft' && key!=='ArrowRight') return;
      const t = e.target;
      const tag = (t.tagName||'').toUpperCase();
      if(tag==='TEXTAREA' || tag==='SELECT') return;
      const isTextInput = tag==='INPUT' && !['checkbox','radio','file','submit','button'].includes((t.type||'text').toLowerCase());
      if((key==='ArrowLeft' || key==='ArrowRight') && isTextInput){
        const atStart = t.selectionStart===0 && t.selectionEnd===0;
        const atEnd = t.selectionStart===t.value.length && t.selectionEnd===t.value.length;
        if(key==='ArrowLeft' && !atStart) return;
        if(key==='ArrowRight' && !atEnd) return;
      }
      const focusables = Array.from(form.querySelectorAll('input, select, textarea, button')).filter(el=>!el.disabled && el.offsetParent!==null);
      const at = focusables.indexOf(t);
      if(at<0) return;
      const focusField = (el)=>{ el.focus({preventScroll:true}); if(el.tagName==='INPUT'){ try{ el.select(); }catch(err){} } };
      if(key==='ArrowLeft' || key==='ArrowRight'){
        const next = focusables[at + (key==='ArrowRight' ? 1 : -1)];
        if(next){ e.preventDefault(); focusField(next); }
        return;
      }
      // Up/Down: try the same field one garment row away first (chips are excluded — a chip's class
      // matches several buttons in the target row, e.g. every color chip, so "same field" is ambiguous
      // for them; they just fall through to plain previous/next field below).
      const row = t.classList.contains('chip-btn') ? null : t.closest('[data-item-idx]');
      if(row){
        const idx = parseInt(row.dataset.itemIdx);
        const fieldClass = Array.from(t.classList).find(c=>c.startsWith('it-'));
        const targetRow = document.querySelector(`#items-wrap [data-item-idx="${idx + (key==='ArrowDown'?1:-1)}"]`);
        const targetEl = (targetRow && fieldClass) ? targetRow.querySelector('.'+fieldClass) : null;
        if(targetEl && !targetEl.disabled && targetEl.offsetParent!==null){
          e.preventDefault(); focusField(targetEl); return;
        }
      }
      const next = focusables[at + (key==='ArrowDown' ? 1 : -1)];
      if(next){ e.preventDefault(); focusField(next); }
    });
    let dueDateManuallySet = false;
    const syncDraftMeta = ()=>{
      draftOrderMeta = {
        phone: form.phone.value, customer: form.customer.value, address: form.address.value, area: form.area.value,
        serviceId: form.serviceId.value, notes: form.notes.value, intakeMethod: form.intakeMethod.value,
        deliveryMode: form.deliveryMode.value, dueDate: form.dueDate.value,
        manualDiscountType: form.manualDiscountType.value, manualDiscountValue: form.manualDiscountValue.value, manualDiscountReason: form.manualDiscountReason.value
      };
    };
    form.dueDate.onchange = ()=>{ dueDateManuallySet = true; syncDraftMeta(); updateTicketPreview(shopId); };
    form.serviceId.onchange = ()=>{
      if(!dueDateManuallySet){
        const service = DB.services.find(s=>s.id===form.serviceId.value) || DB.services[0];

    document.querySelectorAll('.delivery-mode-chip').forEach(chip=>{

    const lookupCustomerByPhone = ()=>{

      const c = findCustomerByPhone(phone);
      if(c){
        form.customer.value = c.name; form.address.value = c.address||''; form.area.value = c.area||'';
        syncDraftMeta();

      const note = document.getElementById('customer-found-note');

      bindCustomerLookupPanel(shopId);
    };
    document.getElementById('phone-input').onblur = lookupCustomerByPhone;
    document.getElementById('phone-input').oninput = ()=>{
      if(form.phone.value.trim().replace(/\D/g,'').length>=7) lookupCustomerByPhone();
    };
    form.onsubmit = async(e)=>{
      e.preventDefault();
      syncDraftMeta();
      const isEdit = !!state.editingOrderId;
      if(isEdit && !hasFullAccess(state.currentStaff.role)){
        showToast('Only Admin or Super Admin can save changes to a saved ticket.'); return;
      }
      if(state.storageMode==='none'){ showToast(`⚠ Saving is not working in this browser at all — this ticket was NOT ${isEdit?'updated':'created'}. See the banner at the top.`); return; }
      if(!form.phone.value.trim()){ showToast('Enter the customer\'s phone number.'); form.phone.focus(); return; }
      if(!form.customer.value.trim()){ showToast('Enter the customer\'s name.'); form.customer.focus(); return; }
      const submitBtn = form.querySelector('button[type="submit"]');
      const defaultBtnLabel = isEdit ? 'Save changes' : 'Create ticket';
      submitBtn.disabled = true; submitBtn.textContent = 'Saving…';
      let order = null;
      let previousSnapshot = null;
      try{
        const timeout = (ms)=>new Promise((_, reject)=>setTimeout(()=>reject(new Error('Saving took too long and timed out')), ms));
        const shopRef = DB.shops.find(s=>s.id===shopId);
        if(!shopRef) throw new Error('This shop no longer exists — pick a shop from the sidebar again.');
        const service = DB.services.find(s=>s.id===form.serviceId.value) || DB.services[0];
        if(!service) throw new Error('No service/turnaround options are set up — add one in Masters → Services.');
        const items = draftItems.filter(i=>i.garmentId).map(i=>{
          const itemGrade = DB.itemGrades.includes(i.grade) ? i.grade : DB.itemGrades[0];
          const pMode = garmentPricingMode(i.garmentId);
          return {
            id: i.id || genItemId(), stage: i.stage || 'received', processingMethod: i.processingMethod||'', pressedBy: i.pressedBy||'', stageLog: i.stageLog||[],
            tagId: i.tagId||'', tagRegistered: i.tagRegistered||false,
            name:garmentName(i.garmentId), qty:i.qty, price:garmentBasePrice(i.garmentId,itemGrade),
            color:i.color||'', defects:i.defects||'', packing:i.packing||DB.packingTypes[0],
            grade: itemGrade,
            treatmentId:i.treatmentId||'', treatmentName:treatmentName(i.treatmentId), treatmentPrice:effectiveTreatmentPrice(i,itemGrade),
            pricingMode: pMode, length:i.length||undefined, width:i.width||undefined,

            unitType: effectiveUnitType(i),
            photoDataUrl: i.photoDataUrl||'', photoAt: i.photoAt||''
          };
        });
        if(items.length===0){ showToast('Add at least one garment.'); submitBtn.disabled=false; submitBtn.textContent=defaultBtnLabel; return; }
        const now = new Date().toISOString();
        const memChk = document.getElementById('apply-membership-discount');
        const membershipDiscountPercent = (memChk && memChk.checked) ? parseFloat(memChk.dataset.percent)||0 : 0;
        const statusChk = document.getElementById('apply-status-discount');
        const statusDiscountPercentApplied = (statusChk && statusChk.checked) ? parseFloat(statusChk.dataset.percent)||0 : 0;

        if(isEdit){
          order = state.orders.find(o=>o.id===state.editingOrderId);
          if(!order) throw new Error('This ticket no longer exists — it may have been removed.');
          previousSnapshot = JSON.parse(JSON.stringify(order));
          Object.assign(order, {
            customer: form.customer.value, phone: form.phone.value, address: form.address.value, area: form.area.value,
            serviceId: service.id, dueDate: form.dueDate.value || addDays(todayISO(), service.days), notes: form.notes.value,
            deliveryMode: form.deliveryMode.value || DB.deliveryModes[0] || '',
            membershipDiscountPercent,
            statusDiscountPercent: statusDiscountPercentApplied,
            manualDiscountType: form.manualDiscountType.value, manualDiscountValue: parseFloat(form.manualDiscountValue.value)||0, manualDiscountReason: form.manualDiscountReason.value.trim(),
            items
          });
          recomputeOrderStage(order); // items may have been added/removed — resync the order's overall stage
          assignMissingItemTagIds(order); // any newly added item still needs its own tag code
          order.transferLog = order.transferLog || [];
          order.transferLog.push({from:'Ticket edited', to:STATUS_LABEL[order.status]||order.status, method:'Manual', by:state.currentStaff.name, at:now});
          const custOk = await Promise.race([upsertCustomer({name:order.customer, phone:order.phone, address:order.address, area:order.area}), timeout(8000)]);
          const ordersOk = await Promise.race([saveOrders(), timeout(8000)]);
          if(!custOk || !ordersOk){
            Object.keys(order).forEach(k=>delete order[k]);
            Object.assign(order, previousSnapshot);
            submitBtn.disabled = false; submitBtn.textContent = defaultBtnLabel;
            showToast(`⚠ Changes to ${order.id} were NOT saved. Your entered details are still in the form. Check the banner at the top, then try again.`);
            render();
            return;
          }
          draftItems = []; draftOrderMeta = {};
          state.editingOrderId = null;
          state.tab='orders';
          showToast(`${order.id} updated.`);
          render();
        } else {
          order = {
            id: nextTicket(shopId), shopId,
            customer: form.customer.value, phone: form.phone.value, address: form.address.value, area: form.area.value,
            serviceId: service.id, dueDate: form.dueDate.value || addDays(todayISO(), service.days), notes: form.notes.value,
            deliveryMode: form.deliveryMode.value || DB.deliveryModes[0] || '',
            membershipDiscountPercent,
            statusDiscountPercent: statusDiscountPercentApplied,
            manualDiscountType: form.manualDiscountType.value, manualDiscountValue: parseFloat(form.manualDiscountValue.value)||0, manualDiscountReason: form.manualDiscountReason.value.trim(),
            items, status:'received', paid:false, paymentMode:null, createdAt:now,
            transferLog:[{from:'—', to:'Received', method:form.intakeMethod.value, by:state.currentStaff.name, at:now}]
          };
          state.orders.push(order);
          assignMissingItemTagIds(order); // give each item its own barcode/RFID tag code, e.g. RV-0001-1
          const custOk = await Promise.race([upsertCustomer({name:order.customer, phone:order.phone, address:order.address, area:order.area}), timeout(8000)]);
          const ordersOk = await Promise.race([saveOrders(), timeout(8000)]);
          if(!custOk || !ordersOk){
            // Roll back: this ticket did NOT actually save, so don't pretend it did.
            state.orders = state.orders.filter(o=>o.id!==order.id);
            submitBtn.disabled = false; submitBtn.textContent = defaultBtnLabel;
            showToast(`⚠ Ticket ${order.id} was NOT saved — nothing was created. Your entered details are still in the form. Check the banner at the top, then try again.`);
            render();
            return;
          }
          draftItems = [];
          draftOrderMeta = {};
          state.tab='orders';
          state.lastCreatedId = order.id;
          state.bookingCameraOrderId = order.id; // camera step first — print/final page opens once a photo is taken or skipped
          render();
          const ps = DB.printSettings[shopId];
          if(ps && ps.autoWhatsApp) sendWhatsApp(order.id);
        }
      }catch(err){
        if(isEdit && order && previousSnapshot){ Object.keys(order).forEach(k=>delete order[k]); Object.assign(order, previousSnapshot); }
        else if(!isEdit && order) state.orders = state.orders.filter(o=>o.id!==order.id);
        submitBtn.disabled = false; submitBtn.textContent = defaultBtnLabel;
        showToast(`⚠ Could not ${isEdit?'save changes to':'create'} this ticket: ` + (err && err.message ? err.message : 'unknown error') + '. Nothing was saved — please try again.');
      }
    };
  }

  if(document.getElementById('order-scan-input')){

  document.querySelectorAll('[data-searchmode]').forEach(el=>{

  }
  if(document.getElementById('homesearch-query')){
    const hsInput = document.getElementById('homesearch-query');
    hsInput.oninput = (e)=>{
      state.homeSearchQuery = e.target.value;
      // The moment the typed text is an exact match for a customer's mobile number, open their

      if(state.homeSearchMode==='customer'){

      if(e.key==='Enter'){

  // Unlocking a ticket (by scan) just enables that row's Select button — it does not select the
  // item on its own. Selection always happens by clicking Select, per item, so nothing moves by
  // accident from a stray scan.
  function unlockTicketInStage(code, stage){
    const found = findByScannedCode(code);
    if(!found) return 0;
    const cards = workshopStageItems(stage);
    // Scanning a specific ITEM's own tag unlocks just that garment; scanning the ORDER's shared
    // ticket number (older tickets, or a shop that only tags at order level) unlocks every one of
    // its items still sitting in this stage.
    const matches = found.item
      ? cards.filter(({order:o,item})=>o.id===found.order.id && item.id===found.item.id)
      : cards.filter(({order:o})=>o.id===found.order.id);
    if(matches.length===0) return 0;
    state.workshopStageUnlocked = state.workshopStageUnlocked || [];
    let added = 0;
    matches.forEach(({order:o,item})=>{
      const key = `${o.id}::${item.id}`;
      if(!state.workshopStageUnlocked.includes(key)){ state.workshopStageUnlocked.push(key); added++; }
    });
    return added;
  }

  if(document.getElementById('workshop-stage-bulk-move')){

      // are never scan-gated, every item currently on this page.
      const selected = isAdmin

      const now = new Date().toISOString();
      // A "treat:<id>" target (only offered on Pre-Processing) means: re-tag the item with that

        if(treatmentTargetName){

        item.stage = actualTargetStage;
        item.stageLog = item.stageLog || [];

        recomputeOrderStage(o);
        moved++;
      });
      await saveOrders();
      showToast(`${moved} item(s) moved to ${targetLabel}.`);
      state.workshopStageSelected = [];
      state.workshopStageUnlocked = [];

          const data = new Uint8Array(reader.result);
          const wb = XLSX.read(data, {type:'array'});

          const rows = XLSX.utils.sheet_to_json(sheet, {defval:''});
          if(rows.length===0) throw new Error('No rows found in this file.');
          const normKey = (k)=>String(k).toLowerCase().replace(/[^a-z0-9]/g,'');
          const headerCandidates = ['itemname','description','itemdescription','item','name','garment','garmentname','product','productname','itemtitle','title'];
          const unitTypeHeaderCandidates = ['countedas','unittype','pcspair','pairorpcs','pairset'];
          const pick = (row)=>{
            const keys = Object.keys(row);
            for(const cand of headerCandidates){
              const k = keys.find(k=>normKey(k)===cand);
              if(k!==undefined && String(row[k]).trim()!=='') return String(row[k]).trim();
            }
            // No recognized header matched — fall back to the first non-empty cell
            // in the row (by column position), which is almost always the item name.
            for(const k of keys){
              const v = String(row[k]).trim();
              if(v!=='') return v;
            }
            return '';
          };
          const pickUnitType = (row)=>{
            const keys = Object.keys(row);
            for(const cand of unitTypeHeaderCandidates){
              const k = keys.find(k=>normKey(k)===cand);
              if(k!==undefined){
                const v = String(row[k]).trim().toLowerCase();
                if(v.startsWith('pair') || v.startsWith('set')) return 'pair';
                if(v) return 'piece';
              }
            }
            return 'piece'; // no recognized column — defaults to No. Pcs, changeable afterward
          };
          let added = 0, skipped = 0, duplicates = 0;
          const dupNames = [], skippedRowNums = [];
          rows.forEach((row,i)=>{
            const description = pick(row);
            if(!description){ skipped++; skippedRowNums.push(i+2); return; } // +2: header row + 1-index
            if(DB.itemDescriptions.some(d=>itemDescName(d).toLowerCase()===description.toLowerCase())){ duplicates++; dupNames.push(description); return; }
            DB.itemDescriptions.push({name:description, unitType:pickUnitType(row)});
            added++;
          });

          } else {

            const summary = `Imported: ${added} added${duplicates?`, ${duplicates} duplicate(s) skipped`:''}${skipped?`, ${skipped} row(s) skipped (empty)`:''} — read ${rows.length} row(s) total.`;

          resultEl.style.display='block';
          resultEl.textContent = '⚠ Could not read this file: ' + (err&&err.message?err.message:'invalid file');
        }

    };

      const filtered = rows.filter(r=> !activeCategory || r.category===activeCategory);
      const selectedIds = state.priceListSelectedIds || [];
      const targetGarmentIds = selectedIds.length ? filtered.filter(r=>selectedIds.includes(r.garmentId)).map(r=>r.garmentId) : filtered.map(r=>r.garmentId);
      const targetTreatments = treatmentScope ? treatments.filter(t=>t.id===treatmentScope) : treatments;
      const targetGrades = gradeScope ? [gradeScope] : grades;
      if(targetGarmentIds.length===0){ showToast('No items to update.'); return; }
      const opLabel = {'inc-pct':`increase by ${rawValue}%`, 'dec-pct':`decrease by ${rawValue}%`, 'inc-amt':`increase by ${money(rawValue)}`, 'dec-amt':`decrease by ${money(rawValue)}`, 'set':`set to ${money(rawValue)}`}[op];

      let cellsUpdated = 0;
      targetGarmentIds.forEach(gid=>{

          targetGrades.forEach(grade=>{
            const base = garmentBasePrice(gid, grade);
            const current = base + garmentTreatmentPrice(gid, t.id, grade);
            let next;
            if(op==='inc-pct') next = current * (1 + rawValue/100);
            else if(op==='dec-pct') next = current * (1 - rawValue/100);
            else if(op==='inc-amt') next = current + rawValue;
            else if(op==='dec-amt') next = current - rawValue;
            else next = rawValue;
            next = Math.max(0, Math.round(next*100)/100);
            if(!DB.treatmentPricing[grade]) DB.treatmentPricing[grade] = {};
            if(!DB.treatmentPricing[grade][gid]) DB.treatmentPricing[grade][gid] = {};
            DB.treatmentPricing[grade][gid][t.id] = next - base;

          if(rows.length===0) throw new Error('No rows found in this file.');
          const normKey = (k)=>String(k).toLowerCase().replace(/[^a-z0-9]/g,'');
          const headerCandidates = ['treatment','treatmentname','name','washtype','service'];
          const manualHeaderCandidates = ['manualprice','manual','manualpriceatbooking'];
          const pick = (row)=>{
            const keys = Object.keys(row);
            for(const cand of headerCandidates){
              const k = keys.find(k=>normKey(k)===cand);
              if(k!==undefined && String(row[k]).trim()!=='') return String(row[k]).trim();
            }
            for(const k of keys){
              const v = String(row[k]).trim();
              if(v!=='') return v;
            }
            return '';
          };
          const pickManual = (row)=>{
            const keys = Object.keys(row);
            for(const cand of manualHeaderCandidates){
              const k = keys.find(k=>normKey(k)===cand);
              if(k!==undefined){
                const v = String(row[k]).trim().toLowerCase();
                return v==='yes' || v==='y' || v==='true' || v==='1';
              }
            }
            return false;
          };
          let added = 0, duplicates = 0, skipped = 0;
          const dupNames = [], skippedRowNums = [];
          rows.forEach((row,i)=>{
            const name = pick(row);
            if(!name){ skipped++; skippedRowNums.push(i+2); return; }
            if(DB.treatments.some(t=>t.name.toLowerCase()===name.toLowerCase())){ duplicates++; dupNames.push(name); return; }
            DB.treatments.push({id:uid('t_'), name, manualPrice: pickManual(row)});
            added++;
          });

            resultEl.style.display='block';
            resultEl.textContent = `⚠ No new treatments found (read ${rows.length} row(s) total). ${duplicates} duplicate(s)${dupNames.length?': '+dupNames.slice(0,8).join(', ')+(dupNames.length>8?'…':''):''}. ${skipped} row(s) had no readable text${skippedRowNums.length?' (row(s) '+skippedRowNums.slice(0,10).join(', ')+(skippedRowNums.length>10?'…':'')+')':''}.`;
          } else {
            ensureMatrix();
            const ok = await saveDB();

      const c = findCustomerByPhone(phone);
      DB.customerLedger = DB.customerLedger || [];
      DB.customerLedger.push({
        id: uid('cl_'), phone, customerName: c ? c.name : (bal?bal.customerName:''),
        type:'payment', amount, shopId: f.shopId.value,
        paymentMode: f.paymentMode.value || 'Cash', notes: (f.notes.value||'').trim(),
        date: todayISO(), createdAt: new Date().toISOString(),
        createdBy: state.currentStaff ? state.currentStaff.name : ''
      });
      await saveDB(); showToast('Payment recorded against the account.'); render();
    };
  }
  // ---- Account Heads master ----
  if(document.getElementById('add-accounthead-form')){
    document.getElementById('add-accounthead-form').onsubmit = async(e)=>{
      e.preventDefault();
      const f = e.target;
      const head = (f.head.value||'').trim();
      if(!head){ showToast('Enter an account head name.'); return; }
      DB.expenseCategories = DB.expenseCategories || [];
      if(DB.expenseCategories.some(c=>c.toLowerCase()===head.toLowerCase())){ showToast('That account head already exists.'); return; }
      DB.expenseCategories.push(head);
      await saveDB(); f.reset(); showToast('Account head added.'); render();
    };
  }
  document.querySelectorAll('.del-accounthead').forEach(btn=>{
    btn.onclick = async()=>{
      DB.expenseCategories.splice(parseInt(btn.dataset.idx),1);
      await saveDB(); showToast('Account head removed.'); render();
    };
  });
  // ---- Account Head Ledger ----
  if(document.getElementById('ahl-from')){
    document.getElementById('ahl-from').onchange = (e)=>{ state.ahlFrom = e.target.value; render(); };
  }
  if(document.getElementById('ahl-to')){
    document.getElementById('ahl-to').onchange = (e)=>{ state.ahlTo = e.target.value; render(); };
  }
  if(document.getElementById('ahl-shop-filter')){
    document.getElementById('ahl-shop-filter').onchange = (e)=>{ state.ahlShop = e.target.value; render(); };
  }
  document.querySelectorAll('.ahl-select-head').forEach(btn=>{
    btn.onclick = ()=>{ state.ahlSelectedHead = btn.dataset.head; render(); };
  });
  document.querySelectorAll('.master-edit-order-btn').forEach(btn=>{
    btn.onclick = ()=>{
      const o = state.orders.find(o=>o.id===btn.dataset.id);
      if(!o) return;
      // Defense in depth: even if the button somehow renders, only Admin/Super Admin can open a
      // saved ticket for editing — Counter Staff and Store Supervisor can create but not change one.
      if(!hasFullAccess(state.currentStaff.role)){
        showToast('Only Admin or Super Admin can edit a saved ticket.'); return;
      }
      state.editingOrderId = o.id;
      draftOrderMeta = {
        phone:o.phone, customer:o.customer, address:o.address, area:o.area,
        serviceId:o.serviceId, notes:o.notes,
        intakeMethod:(o.transferLog&&o.transferLog[0])?o.transferLog[0].method:DB.transferMethods[0],
        deliveryMode:o.deliveryMode, dueDate:o.dueDate,
        manualDiscountType:o.manualDiscountType, manualDiscountValue:o.manualDiscountValue, manualDiscountReason:o.manualDiscountReason
      };
      draftItems = o.items.map(i=>{
        const g = DB.garments.find(g=>g.name===i.name);
        const t = i.treatmentId ? DB.treatments.find(t=>t.id===i.treatmentId) : null;
        return {garmentId: g?g.id:'', category: g?(g.category||'Uncategorized'):'', qty:i.qty, color:i.color||'', defects:i.defects||'', packing:i.packing||DB.packingTypes[0], treatmentId:i.treatmentId||'', manualTreatmentPrice:(t&&t.manualPrice)?(i.treatmentPrice||0):undefined, grade:(i.grade && DB.itemGrades.includes(i.grade))?i.grade:'', length:i.length, width:i.width, pieces:i.pieces||1, unitType: (i.unitType==='pair'||i.unitType==='piece') ? i.unitType : undefined, photoDataUrl:i.photoDataUrl||'', photoAt:i.photoAt||'',
          id:i.id, stage:i.stage, processingMethod:i.processingMethod, pressedBy:i.pressedBy, stageLog:i.stageLog, tagId:i.tagId, tagRegistered:i.tagRegistered};
      });
      state.view='shop'; state.activeShop=o.shopId; state.tab='new';
      render();
    };
  });
  document.querySelectorAll('.master-cancel-order-btn').forEach(btn=>{
    btn.onclick = ()=>{
      const o = state.orders.find(o=>o.id===btn.dataset.id);
      if(o && !hasFullAccess(state.currentStaff.role)){
        showToast('Only Admin or Super Admin can cancel a saved ticket.'); return;
      }
      state.cancellingOrderId = btn.dataset.id; render();
    };
  });
  document.querySelectorAll('.master-assignshop-order-btn').forEach(btn=>{
    btn.onclick = ()=>{
      if(!hasFullAccess(state.currentStaff.role)){
        showToast('Only Admin or Super Admin can assign a ticket to a shop.'); return;
      }
      state.assigningShopOrderId = btn.dataset.id; render();
    };
  });
  if(document.getElementById('assign-shop-back')){
    document.getElementById('assign-shop-back').onclick = ()=>{ state.assigningShopOrderId = null; render(); };
  }
  if(document.getElementById('assign-shop-form')){
    document.getElementById('assign-shop-form').onsubmit = async(e)=>{
      e.preventDefault();
      const f = e.target;
      const orderId = f.dataset.order;
      const o = state.orders.find(o=>o.id===orderId);
      if(!o) return;
      if(!hasFullAccess(state.currentStaff.role)){
        showToast('Only Admin or Super Admin can assign a ticket to a shop.'); state.assigningShopOrderId=null; render(); return;
      }
      const newShopId = f.shopId.value;
      const shopRef = DB.shops.find(s=>s.id===newShopId);
      if(!shopRef){ showToast('Pick a shop.'); return; }
      o.shopId = newShopId;
      o.transferLog = o.transferLog || [];
      o.transferLog.push({from:'Shop assigned', to:shopRef.name, method:'Manual', by:state.currentStaff.name, at:new Date().toISOString()});
      await saveOrders();
      state.assigningShopOrderId = null;
      showToast(`${o.id} assigned to ${shopRef.name}.`);
      render();
    };
  }
  if(document.getElementById('cancel-order-back')){
    document.getElementById('cancel-order-back').onclick = ()=>{ state.cancellingOrderId = null; render(); };
  }
  if(document.getElementById('cancel-order-form')){
    document.getElementById('cancel-order-form').onsubmit = async(e)=>{
      e.preventDefault();
      const f = e.target;
      const orderId = f.dataset.order;
      const o = state.orders.find(o=>o.id===orderId);
      if(!o) return;
      if(!hasFullAccess(state.currentStaff.role)){
        showToast('Only Admin or Super Admin can cancel a saved ticket.'); state.cancellingOrderId=null; render(); return;
      }
      const from = STATUS_LABEL[o.status] || o.status;
      o.cancelledFromStatus = o.status;
      o.status = 'cancelled';
      o.cancelledAt = new Date().toISOString();
      o.cancelledReason = f.reason.value.trim();
      o.transferLog = o.transferLog || [];
      o.transferLog.push({from, to:'Cancelled', method:'Manual', by:state.currentStaff.name, at:o.cancelledAt});
      await saveOrders();
      await closeDropForOrder(o.id, o.cancelledAt);
      state.cancellingOrderId = null;
      showToast(`${o.id} cancelled.`); render();
    };
  }
  // ---- Super Admin: permanent ticket delete (works even on invoiced/delivered tickets) ----
// Permanently removes a ticket and everything tied to it (invoices, ledger entries raised from
// those invoices, and any pickup/drop scheduling). Super Admin only — shared by the "type DELETE
// to confirm" form in the Orders list and the Delete button on the Edit Ticket screen, so both
// paths behave identically.
async function deleteOrderPermanently(orderId){
  const o = state.orders.find(o=>o.id===orderId);
  if(!o) return false;
  state.orders = state.orders.filter(ord=>ord.id!==orderId);
  const removedInvoiceIds = DB.invoices.filter(inv=>inv.orderId===orderId).map(inv=>inv.id);
  DB.invoices = DB.invoices.filter(inv=>inv.orderId!==orderId);
  if(removedInvoiceIds.length && DB.customerLedger){
    DB.customerLedger = DB.customerLedger.filter(cl=>!removedInvoiceIds.includes(cl.invoiceId));
  }
  let deliveriesChanged = false;
  if(state.pickups){ const before=state.pickups.length; state.pickups = state.pickups.filter(p=>p.orderId!==orderId); if(state.pickups.length!==before) deliveriesChanged = true; }
  if(state.drops){ const before=state.drops.length; state.drops = state.drops.filter(d=>d.orderId!==orderId); if(state.drops.length!==before) deliveriesChanged = true; }
  await saveOrders();
  await saveDB();
  if(deliveriesChanged) await saveDeliveries();
  return true;
}
  if(document.getElementById('edit-ticket-delete-btn')){
    document.getElementById('edit-ticket-delete-btn').onclick = async ()=>{
      const btn = document.getElementById('edit-ticket-delete-btn');
      const orderId = btn.dataset.id;
      const o = state.orders.find(o=>o.id===orderId);
      if(!o) return;
      if(state.currentStaff.role!=='superadmin'){
        showToast('Only Super Admin can delete a ticket.');
        return;
      }
      if(!confirm(`Permanently delete ticket ${orderId}? This removes it, any invoice on it, and any scheduled pickup/drop — this cannot be undone.`)) return;
      await deleteOrderPermanently(orderId);
      state.editingOrderId = null; draftItems = []; draftOrderMeta = {};
      showToast(`${orderId} permanently deleted.`);
      render();
    };
  }
  document.querySelectorAll('.master-delete-order-btn').forEach(btn=>{
    btn.onclick = ()=>{
      if(!(state.currentStaff && state.currentStaff.role==='superadmin')){
        showToast('Only Super Admin can delete a ticket.'); return;
      }
      state.deletingOrderId = btn.dataset.id; state.cancellingOrderId = null; render();
    };
  });
  if(document.getElementById('delete-order-back')){
    document.getElementById('delete-order-back').onclick = ()=>{ state.deletingOrderId = null; render(); };
  }
  if(document.getElementById('delete-order-form')){
    document.getElementById('delete-order-form').onsubmit = async(e)=>{
      e.preventDefault();
      if(!(state.currentStaff && state.currentStaff.role==='superadmin')){
        showToast('Only Super Admin can delete a ticket.'); state.deletingOrderId=null; render(); return;
      }
      const f = e.target;
      const orderId = f.dataset.order;
      if((f.confirm.value||'').trim().toUpperCase()!=='DELETE'){
        showToast('Type DELETE to confirm.'); return;
      }
      const o = state.orders.find(o=>o.id===orderId);
      if(!o) return;
      await deleteOrderPermanently(orderId);
      state.deletingOrderId = null;
      showToast(`${orderId} permanently deleted.`); render();
    };
  }
  document.querySelectorAll('.master-reactivate-order-btn').forEach(btn=>{
    btn.onclick = async()=>{
      const o = state.orders.find(o=>o.id===btn.dataset.id);
      if(!o) return;
      if(!hasFullAccess(state.currentStaff.role)){
        showToast('Only Admin or Super Admin can reactivate a ticket.'); return;
      }
      const restoreStatus = o.cancelledFromStatus || 'received';
      o.transferLog = o.transferLog || [];
      o.transferLog.push({from:'Cancelled', to:STATUS_LABEL[restoreStatus]||restoreStatus, method:'Manual', by:state.currentStaff.name, at:new Date().toISOString()});
      o.status = restoreStatus;
      delete o.cancelledFromStatus; delete o.cancelledAt; delete o.cancelledReason;
      await saveOrders(); showToast(`${o.id} reactivated.`); render();
    };
  });

  // ---- Delivery Lookup (front counter) ----
  if(document.getElementById('delivery-lookup-phone')){
    const dlInput = document.getElementById('delivery-lookup-phone');
    dlInput.oninput = (e)=>{ state.deliveryLookupPhone = e.target.value; render(); };
    dlInput.onkeydown = (e)=>{ if(e.key==='Enter') e.preventDefault(); };
    dlInput.focus(); dlInput.setSelectionRange(dlInput.value.length, dlInput.value.length);
  }
  // ---- Home Delivery: Pickup Scheduler ----
  if(document.getElementById('pickup-phone-input')){
    const phoneInput = document.getElementById('pickup-phone-input');
    const infoBox = document.getElementById('pickup-customer-info');
    const form = document.getElementById('add-pickup-form');
    const nameInput = form.querySelector('[name="customerName"]');
    const addressInput = form.querySelector('[name="address"]');
    const areaInput = form.querySelector('[name="area"]');
    const updateFromPhone = ()=>{
      const phone = phoneInput.value.trim();
      if(infoBox) infoBox.innerHTML = renderPickupCustomerInfoHtml(phone);
      const c = phone ? findCustomerByPhone(phone) : null;
      if(c){
        if(nameInput && !nameInput.value.trim()) nameInput.value = c.name || '';
        if(addressInput && !addressInput.value.trim()) addressInput.value = c.address || '';
        if(areaInput && !areaInput.value.trim()) areaInput.value = c.area || '';
      }
    };
    phoneInput.oninput = updateFromPhone;
    phoneInput.onblur = updateFromPhone;
  }
  if(document.getElementById('add-pickup-form')){
    document.getElementById('add-pickup-form').onsubmit = async(e)=>{
      e.preventDefault();
      const f = e.target;
      const phone = f.phone.value.trim(), customerName = f.customerName.value.trim();
      if(!phone || !customerName){ showToast("Enter the customer's phone and name."); return; }
      const pickup = {
        id: uid('pu_'), shopId: f.shopId.value, phone, customerName,
        address: f.address.value.trim(), area: f.area.value.trim(),
        scheduledDate: f.scheduledDate.value || todayISO(), scheduledSlot: f.scheduledSlot.value,
        driverId: f.driverId.value, notes: f.notes.value.trim(),
        status: f.driverId.value ? 'assigned' : 'pending', createdAt: new Date().toISOString()
      };
      state.pickups.push(pickup);
      await saveDeliveries(); f.reset(); showToast('Pickup scheduled.'); render();
    };
  }
  document.querySelectorAll('.pickup-driver-select').forEach(sel=>{
    sel.onchange = async()=>{
      const p = state.pickups.find(p=>p.id===sel.dataset.id);
      if(!p) return;
      p.driverId = sel.value;
      if(p.status==='pending' && p.driverId) p.status='assigned';
      if(p.status==='assigned' && !p.driverId) p.status='pending';
      await saveDeliveries(); showToast(p.driverId?`Assigned to ${driverName(p.driverId)}.`:'Driver unassigned.'); render();
    };
  });
  document.querySelectorAll('.pickup-mark-picked-btn').forEach(btn=>{
    btn.onclick = async()=>{
      const p = state.pickups.find(p=>p.id===btn.dataset.id);
      if(!p) return;
      p.status='picked_up'; p.pickedUpAt=new Date().toISOString();
      await saveDeliveries(); showToast('Marked as picked up.'); render();
    };
  });
  document.querySelectorAll('.pickup-cancel-btn').forEach(btn=>{
    btn.onclick = async()=>{
      const p = state.pickups.find(p=>p.id===btn.dataset.id);
      if(!p) return;
      p.status='cancelled';
      await saveDeliveries(); showToast('Pickup cancelled.'); render();
    };
  });
  document.querySelectorAll('.pickup-start-order-btn').forEach(btn=>{
    btn.onclick = ()=>{
      const p = state.pickups.find(p=>p.id===btn.dataset.id);
      if(!p) return;
      draftOrderMeta = {phone:p.phone, customer:p.customerName, address:p.address, area:p.area, deliveryMode:'Home Delivery'};
      draftItems = [];
      state.view='shop'; state.activeShop=p.shopId; state.tab='new';
      showToast(`Starting a ticket for ${p.customerName} — mark the pickup "Picked Up" once garments are collected.`);
    };
  });

  // ---- Home Delivery: Drop Scheduler ----
  document.querySelectorAll('.schedule-drop-btn').forEach(btn=>{
    btn.onclick = ()=>{ state.schedulingDropOrderId = btn.dataset.id; render(); };
  });
  if(document.getElementById('schedule-drop-cancel')){
    document.getElementById('schedule-drop-cancel').onclick = ()=>{ state.schedulingDropOrderId=null; render(); };
  }
  if(document.getElementById('schedule-drop-form')){
    document.getElementById('schedule-drop-form').onsubmit = async(e)=>{
      e.preventDefault();
      const f = e.target;
      const orderId = f.dataset.order;
      const o = state.orders.find(o=>o.id===orderId);
      if(!o) return;
      const drop = {
        id: uid('dr_'), orderId, shopId:o.shopId,
        customerName:o.customer, phone:o.phone, address:o.address, area:o.area,
        scheduledDate: f.scheduledDate.value || todayISO(), scheduledSlot: f.scheduledSlot.value,
        notes: f.notes.value.trim(), driverId: f.driverId.value,
        status: f.driverId.value ? 'assigned' : 'pending', createdAt: new Date().toISOString()
      };
      state.drops.push(drop);
      state.schedulingDropOrderId = null;
      await saveDeliveries(); showToast(`Drop scheduled for ${o.id}.`); render();
    };
  }
  document.querySelectorAll('.drop-driver-select').forEach(sel=>{
    sel.onchange = async()=>{
      const d = state.drops.find(d=>d.id===sel.dataset.id);
      if(!d) return;
      d.driverId = sel.value;
      if(d.status==='pending' && d.driverId) d.status='assigned';
      if(d.status==='assigned' && !d.driverId) d.status='pending';
      await saveDeliveries(); showToast(d.driverId?`Assigned to ${driverName(d.driverId)}.`:'Driver unassigned.'); render();
    };
  });
  document.querySelectorAll('.drop-cancel-btn').forEach(btn=>{
    btn.onclick = async()=>{
      const d = state.drops.find(d=>d.id===btn.dataset.id);
      if(!d) return;
      d.status='cancelled';
      await saveDeliveries(); showToast('Drop cancelled.'); render();
    };
  });

  // ---- Home Delivery: Drivers & dispatch ----
  if(document.getElementById('add-driver-form')){
    document.getElementById('add-driver-form').onsubmit = async(e)=>{
      e.preventDefault();
      const f = e.target; const name = f.name.value.trim();
      if(!name){ showToast("Enter the driver's name."); return; }
      DB.drivers = DB.drivers || [];
      DB.drivers.push({id: uid('drv_'), name, phone: f.phone.value.trim(), vehicle: f.vehicle.value.trim()});
      await saveDB(); f.reset(); showToast('Driver added.'); render();
    };
  }
  document.querySelectorAll('.del-driver').forEach(btn=>{
    btn.onclick = async()=>{
      DB.drivers = (DB.drivers||[]).filter(d=>d.id!==btn.dataset.id);
      await saveDB(); showToast('Driver removed.'); render();
    };
  });
  document.querySelectorAll('.dispatch-assign-btn').forEach(btn=>{
    btn.onclick = async()=>{
      const kind = btn.dataset.kind, id = btn.dataset.id;
      const sel = document.querySelector(`.dispatch-driver-select[data-kind="${kind}"][data-id="${id}"]`);
      const driverId = sel ? sel.value : '';
      if(!driverId){ showToast('Pick a driver first.'); return; }
      const list = kind==='pickup' ? state.pickups : state.drops;
      const item = list.find(x=>x.id===id);
      if(!item) return;
      item.driverId = driverId; item.status='assigned';
      await saveDeliveries(); showToast(`Assigned to ${driverName(driverId)}.`); render();
    };
  });
}

window.onerror = function(msg, src, line, col, err){
  var el = document.getElementById('fatal-error-banner');
  if(!el){
    el = document.createElement('div');
    el.id = 'fatal-error-banner';
    el.style.cssText = 'position:fixed; top:0; left:0; right:0; background:#8A2E2A; color:#fff; padding:14px 20px; font-family:sans-serif; font-size:13px; z-index:9999; text-align:center;';
    document.body.insertBefore(el, document.body.firstChild);
  }
  el.textContent = '⚠ Something went wrong loading this app (' + msg + ', line ' + line + '). Please screenshot this message and send it back for a fix.';
  return false;
};
// Browsers change a focused <input type="number">'s value when the mouse wheel scrolls over it —
// on the Booking page this meant scrolling past the Qty/Panels/Length/Width/pieces fields could
// silently bump their numbers. Blur the field the instant a wheel event reaches it while focused,
// so scrolling just scrolls the page like normal; only the keyboard's up/down arrows (or clicking
// the input's own spinner arrows) still change the value.
document.addEventListener('wheel', function(e){
  const el = document.activeElement;
  if(el && el.tagName==='INPUT' && el.type==='number'){ el.blur(); }
}, {passive:true});
loadAll();
</script>
</body>
